# One-command backend stack: SQL Server + schema init + Cinema Web API.
#
#   docker compose up -d
#
# `db-init` waits for SQL Server, creates the Cinema database if missing, and - only when the schema does not exist
# yet - runs create_db.sql -> upgrade_db.sql -> insert_db.sql (same order as CI) and then writes the dbo.__DbInit marker.
# create_db.sql DROPS tables, so it only runs on a database with neither marker nor schema; otherwise only the idempotent
# upgrade_db.sql runs and a restart never wipes data. The SA password is ${CINEMA_DB_PASSWORD} (default: the dev value). To reset: `docker compose down -v`.
# Schema is not managed by EF migrations in this repo.
#
# API: http://localhost:5102 (container port 8080). The frontend apps are run separately with `ng serve` (see README):
# CinemaUser 4202, CinemaAdmin 4201, CinemaStaff 4203.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${CINEMA_DB_PASSWORD:-Cinema_Dev_Pwd_123!}"
    ports:
      - "1433:1433"
    volumes:
      - cinema-mssql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    environment:
      SA_PASSWORD: "${CINEMA_DB_PASSWORD:-Cinema_Dev_Pwd_123!}"
    volumes:
      - ./cinemabe/sql:/sql:ro
    entrypoint: ["/bin/bash", "-c"]
    # -I: QUOTED_IDENTIFIER ON (filtered indexes need it); -b: stop on any SQL error; -f 65001: Vietnamese N'...' literals.
    command:
      - |
        set -e
        S="/opt/mssql-tools18/bin/sqlcmd -C -I -b -S db -U sa -P $$SA_PASSWORD -f 65001"
        # probe <sql>: prints 0 or 1; anything else (sqlcmd failure, unexpected output) fails the container.
        probe() {
          out=$$($$S -h -1 -W -d Cinema -Q "SET NOCOUNT ON; $$1") || exit 1
          out=$$(echo "$$out" | tr -d '[:space:]')
          case "$$out" in 0|1) echo "$$out" ;; *) echo "unexpected probe result: $$out" >&2; exit 1 ;; esac
        }
        mark() { $$S -d Cinema -Q "IF OBJECT_ID('dbo.__DbInit','U') IS NULL CREATE TABLE dbo.__DbInit (Id int NOT NULL PRIMARY KEY, CompletedAt datetime NOT NULL DEFAULT GETDATE()); IF NOT EXISTS (SELECT 1 FROM dbo.__DbInit) INSERT dbo.__DbInit (Id) VALUES (1);"; }
        $$S -Q "IF DB_ID('Cinema') IS NULL CREATE DATABASE [Cinema];"
        HAS_MARKER=$$(probe "SELECT CASE WHEN OBJECT_ID('dbo.__DbInit','U') IS NULL THEN 0 ELSE 1 END") || exit 1
        HAS_SCHEMA=$$(probe "SELECT CASE WHEN OBJECT_ID('dbo.AgeRestriction','U') IS NULL THEN 0 ELSE 1 END") || exit 1
        if [ "$$HAS_MARKER" = "1" ]; then
          echo "Init marker present - applying upgrade_db.sql only (idempotent)"
          $$S -d Cinema -i /sql/upgrade_db.sql
        elif [ "$$HAS_SCHEMA" = "0" ]; then
          echo "Fresh database - create, upgrade, seed"
          for f in create_db upgrade_db insert_db; do $$S -d Cinema -i /sql/$$f.sql; done
          mark
        else
          echo "Schema exists without an init marker (legacy volume or a failed earlier init) - NOT running create_db.sql (it drops tables); applying upgrade_db.sql only."
          echo "If the database is half-built, reset it with: docker compose down -v"
          $$S -d Cinema -i /sql/upgrade_db.sql
          mark
        fi

  api:
    build: ./cinemabe
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__CinemaDatabase: "Server=db;Database=Cinema;User ID=sa;Password=${CINEMA_DB_PASSWORD:-Cinema_Dev_Pwd_123!};TrustServerCertificate=True;MultipleActiveResultSets=true"
      # Dev-only signing key for local compose; override for any real deployment.
      JWT__Secret: "compose-dev-signing-key-not-for-production-change-me-1234567890"
      # Local demo only: the Sandbox gateway approves unsigned callbacks. Never enable it on a real deployment
      # (Payments__EnableSandbox is off by default outside Development).
      Payments__EnableSandbox: "true"
      AllowedOrigins__0: "http://localhost:4202"
      AllowedOrigins__1: "http://localhost:4201"
      AllowedOrigins__2: "http://localhost:4203"
    volumes:
      - cinema-logs:/app/logs
    ports:
      - "5102:8080"

volumes:
  cinema-mssql:
  cinema-logs:
