# One-command backend stack: SQL Server + schema init + Cinema Web API.
#
#   docker compose up -d
#
# `db-init` waits for SQL Server, creates the Cinema database if missing, and - only when the schema does not exist
# yet - runs create_db.sql -> upgrade_db.sql -> insert_db.sql (same order as CI). create_db.sql DROPS tables, so the
# init is skipped when the schema is already there and a restart never wipes data. To reset: `docker compose down -v`.
# Schema is not managed by EF migrations in this repo.
#
# API: http://localhost:5102 (container port 8080). The frontend apps are run separately with `ng serve` (see README):
# CinemaUser 4202, CinemaAdmin 4201, CinemaStaff 4203.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Cinema_Dev_Pwd_123!"
    ports:
      - "1433:1433"
    volumes:
      - cinema-mssql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    environment:
      SA_PASSWORD: "Cinema_Dev_Pwd_123!"
    volumes:
      - ./cinemabe/sql:/sql:ro
    entrypoint: ["/bin/bash", "-c"]
    # -I: QUOTED_IDENTIFIER ON (filtered indexes need it); -b: stop on any SQL error; -f 65001: Vietnamese N'...' literals.
    command:
      - |
        set -e
        S="/opt/mssql-tools18/bin/sqlcmd -C -I -b -S db -U sa -P $$SA_PASSWORD -f 65001"
        $$S -Q "IF DB_ID('Cinema') IS NULL CREATE DATABASE [Cinema];"
        if [ "$$($$S -h -1 -W -d Cinema -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.tables WHERE name = 'AgeRestriction'" | tr -d '[:space:]')" = "0" ]; then
          echo "Empty schema - creating, upgrading and seeding"
          for f in create_db upgrade_db insert_db; do $$S -d Cinema -i /sql/$$f.sql; done
        else
          echo "Schema already present - nothing to do"
        fi

  api:
    build: ./cinemabe
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__CinemaDatabase: "Server=db;Database=Cinema;User ID=sa;Password=Cinema_Dev_Pwd_123!;TrustServerCertificate=True;MultipleActiveResultSets=true"
      # Dev-only signing key for local compose; override for any real deployment.
      JWT__Secret: "compose-dev-signing-key-not-for-production-change-me-1234567890"
      # Local demo only: the Sandbox gateway approves unsigned callbacks. Never enable it on a real deployment
      # (Payments__EnableSandbox is off by default outside Development).
      Payments__EnableSandbox: "true"
      AllowedOrigins__0: "http://localhost:4202"
      AllowedOrigins__1: "http://localhost:4201"
      AllowedOrigins__2: "http://localhost:4203"
    ports:
      - "5102:8080"

volumes:
  cinema-mssql:
