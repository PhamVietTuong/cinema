# ─────────────────────────────────────────────────────────────────────────────
# Cinema — Flow regression test
# Flow : Food & drink inventory, combos, storage plans, back-office roles
# Invoked by : /test-flow inventory-storage-plan
# ─────────────────────────────────────────────────────────────────────────────

flow_id: inventory-storage-plan
name: "Inventory, combos & storage plans — stock ledger, deduct/restore, plan lifecycle, theater scoping"
description: >
  Verifies that a change touching opt-in food/drink stock tracking does not break:
  (1) QuantityOnHand only changing through the guarded FoodAndDrinkStore.TryApplyStockDeltaAsync,
      always paired with an insert-only StockMovement ledger row,
  (2) CreateBookingAsync deducting stock inside its transaction, in ascending id order,
      with combos expanded into their tracked components (a combo holds no stock),
  (3) Cancel / Refund / Expire restocking from the ledger (GetNetSaleQuantitiesAsync),
      idempotently, never from the current combo recipe,
  (4) storage plan lifecycle Draft -> Submitted -> Approved|Rejected -> Received|Cancelled,
      Receive only from Approved and guarded by the plan RowVersion,
  (5) Approve/Reject limited to RoleNames.StockApprovers (Admin, TheaterManager),
  (6) back-office endpoints scoped by TryGetBackOfficeScope and answering 403 (never 401) on scope failure,
  (7) food Create/Update requests carrying no inventory or combo fields,
  (8) combos never tracked and never nested.

layers: [business, data, service, frontend]
version: 1.0
last_updated: 2026-10-04
maintained_by: "Cinema QA"

# ─────────────────────────────────────────────────────────────────────────────
# §1 — Files that trigger this test when modified
# ─────────────────────────────────────────────────────────────────────────────
trigger_paths:
  - "Cinema/2-Business/Cinema.Business/Managers/InventoryManager.cs"
  - "Cinema/2-Business/Cinema.Business/Managers/ComboManager.cs"
  - "Cinema/2-Business/Cinema.Business/Managers/StoragePlanManager.cs"
  - "Cinema/2-Business/Cinema.Business/Managers/BookingManager.cs"
  - "Cinema/2-Business/Cinema.Business/Managers/FoodStockRestorer.cs"
  - "Cinema/2-Business/Cinema.Business/Managers/FoodAndDrinkManager.cs"
  - "Cinema/2-Business/Cinema.Business/Managers/JoinManagers.cs"
  - "Cinema/2-Business/Cinema.Business/Helpers/ComboAvailability.cs"
  - "Cinema/2-Business/Cinema.Business.DTO/Catalog/FoodAndDrinkDTOs.cs"
  - "Cinema/2-Business/Cinema.Business.DTO/Auth/RoleNames.cs"
  - "Cinema/3-Data/Cinema.Data/Stores/FoodAndDrinkStore.cs"
  - "Cinema/3-Data/Cinema.Data/Stores/StockMovementStore.cs"
  - "Cinema/3-Data/Cinema.Data/Stores/StoragePlanStore.cs"
  - "Cinema/3-Data/Cinema.Data/Stores/ComboItemStore.cs"
  - "Cinema/3-Data/Cinema.Data/Configurations/InventoryConfiguration.cs"
  - "Cinema/1-Service/Cinema.Service.WebApiHost/Controllers/CinemaController.cs"
  - "Cinema/1-Service/Cinema.Service.WebApiHost/Helpers/ClaimsPrincipalExtensions.cs"
  - "projects/CinemaStaff/src/app/features/warehouse/"
  - "projects/CinemaAdmin/src/app/features/modules/overview/theaters/food-and-drink.dialog.ts"
  - "projects/CinemaAdmin/src/app/features/modules/overview/theaters/food-and-drink.dialog.html"

trigger_keywords:
  - "TryApplyStockDeltaAsync"
  - "QuantityOnHand"
  - "TrackInventory"
  - "StockMovement"
  - "GetNetSaleQuantitiesAsync"
  - "FoodStockRestorer"
  - "ComboItem"
  - "IsCombo"
  - "StoragePlan"
  - "StockApprovers"
  - "TryGetBackOfficeScope"
  - "RoleNames"

# ─────────────────────────────────────────────────────────────────────────────
# §2 — Static checks
# ─────────────────────────────────────────────────────────────────────────────
static_checks:

  - id: SC-INV-01
    severity: P0
    description: >
      The only primitive that changes QuantityOnHand is the guarded conditional UPDATE
      FoodAndDrinkStore.TryApplyStockDeltaAsync (refuses to go below zero, atomic under concurrency).
    file: "Cinema/3-Data/Cinema.Data/Stores/FoodAndDrinkStore.cs"
    method: "TryApplyStockDeltaAsync"
    must_contain:
      - pattern: "QuantityOnHand + delta >= 0"
        rationale: "Stock can never be driven negative; oversell fails the UPDATE instead of racing"
      - pattern: "ExecuteUpdateAsync"
        rationale: "Single atomic SQL UPDATE, not read-modify-write on a tracked entity"

  - id: SC-INV-02
    severity: P0
    description: >
      Managers never assign QuantityOnHand directly (no read-modify-write); every stock change goes
      through TryApplyStockDeltaAsync.
    files:
      - "Cinema/2-Business/Cinema.Business/Managers/InventoryManager.cs"
      - "Cinema/2-Business/Cinema.Business/Managers/StoragePlanManager.cs"
      - "Cinema/2-Business/Cinema.Business/Managers/BookingManager.cs"
      - "Cinema/2-Business/Cinema.Business/Managers/FoodStockRestorer.cs"
      - "Cinema/2-Business/Cinema.Business/Managers/FoodAndDrinkManager.cs"
      - "Cinema/2-Business/Cinema.Business/Managers/ComboManager.cs"
    forbidden_patterns:
      - regex: '\.QuantityOnHand\s*[-+]?=[^=]'
        rationale: "Direct assignment to QuantityOnHand bypasses the non-negative guard and the ledger"

  - id: SC-INV-03
    severity: P0
    description: >
      Every stock change is paired with a StockMovement ledger row. InventoryManager.ApplyAndRecordAsync
      is the single manual-adjustment path (delta + ledger row); Receive writes a Receive row per line.
    files:
      - "Cinema/2-Business/Cinema.Business/Managers/InventoryManager.cs"
      - "Cinema/2-Business/Cinema.Business/Managers/StoragePlanManager.cs"
    must_contain:
      - pattern: "TryApplyStockDeltaAsync"
        rationale: "Guarded stock write"
      - pattern: "StockMovementStore.CreateAsync"
        rationale: "Ledger row written next to the stock change"

  - id: SC-INV-04
    severity: P0
    description: >
      The ledger is insert-only: no code path updates or deletes StockMovement rows.
    files:
      - "Cinema/2-Business/Cinema.Business/Managers/InventoryManager.cs"
      - "Cinema/2-Business/Cinema.Business/Managers/StoragePlanManager.cs"
      - "Cinema/2-Business/Cinema.Business/Managers/BookingManager.cs"
      - "Cinema/2-Business/Cinema.Business/Managers/FoodStockRestorer.cs"
      - "Cinema/2-Business/Cinema.Business/Managers/FoodAndDrinkManager.cs"
    forbidden_patterns:
      - regex: 'StockMovementStore\.(Update|Delete|Remove)'
        rationale: "Corrections are new compensating rows, never edits of history (restock is derived from the ledger)"

  - id: SC-INV-05
    severity: P0
    description: >
      Selling deducts stock inside the CreateBookingAsync transaction: BeginTransactionAsync is opened
      first, then BuildFoodLinesAndReserveStockAsync, and the Sale ledger rows are written with the invoice.
    file: "Cinema/2-Business/Cinema.Business/Managers/BookingManager.cs"
    method: "CreateBookingAsync"
    must_contain:
      - pattern: "BeginTransactionAsync"
        rationale: "Deduction + invoice commit or roll back together"
      - pattern: "ComposeInvoiceAsync"
        rationale: "Since P4 the shared compose step (which calls BuildFoodLinesAndReserveStockAsync) runs inside the booking transaction"
      - pattern: "RecordSaleMovementsAsync"
        rationale: "Sale ledger rows persisted with the invoice"
      - pattern: "RollbackTransactionAsync"
        rationale: "Failed booking returns the stock"

  - id: SC-INV-05B
    severity: P0
    description: >
      The shared compose step reserves stock through BuildFoodLinesAndReserveStockAsync. Both CreateBookingAsync
      (online, Pending) and SellAtCounterAsync (counter, Paid) call it inside their own transaction.
    file: "Cinema/2-Business/Cinema.Business/Managers/BookingManager.cs"
    method: "ComposeInvoiceAsync"
    must_contain:
      - pattern: "BuildFoodLinesAndReserveStockAsync"
        rationale: "Stock is reserved inside the caller's transaction"

  - id: SC-INV-06
    severity: P0
    description: >
      Stock deduction runs in a fixed ascending item-id order (prevents deadlocks between concurrent
      bookings) and combos are expanded into their components (a combo line never deducts its own stock).
    file: "Cinema/2-Business/Cinema.Business/Managers/BookingManager.cs"
    method: "BuildFoodLinesAndReserveStockAsync"
    must_contain:
      - pattern: "OrderBy(d => d.Food.Id)"
        rationale: "Ascending id order across all demanded items"
      - pattern: "TryApplyStockDeltaAsync(entry.Food.Id, -entry.Quantity)"
        rationale: "Guarded negative delta per demanded item"
      - pattern: "GetByCombosAsync"
        rationale: "Combo lines expand through the ComboItem recipe into tracked components"
      - pattern: "comboQuantity * recipe.Quantity"
        rationale: "Component demand = combo units x recipe quantity"
      - pattern: "if (!item.TrackInventory)"
        rationale: "Untracked items never touch stock"

  - id: SC-INV-07
    severity: P0
    description: >
      Restock after Cancel / Refund / Expire is ledger-driven: it reads GetNetSaleQuantitiesAsync (net
      Sale quantity per invoice+item), NOT the current combo recipe (the recipe may have changed since
      the sale), and is idempotent (net already zero -> nothing to restore).
    file: "Cinema/2-Business/Cinema.Business/Managers/FoodStockRestorer.cs"
    must_contain:
      - pattern: "GetNetSaleQuantitiesAsync"
        rationale: "Owed quantity comes from the ledger"
      - pattern: "NetQuantity < 0"
        rationale: "Only units still owed back to the shelf are restored (idempotent)"
      - pattern: "TryApplyStockDeltaAsync"
        rationale: "Guarded stock write"
      - pattern: "StockMovementStore.CreateRangeAsync"
        rationale: "Restore ledger rows recorded"
    must_not_contain:
      - pattern: "ComboItemStore"
        rationale: "Restock must not re-derive quantities from the (mutable) combo recipe"

  - id: SC-INV-08
    severity: P0
    description: >
      Cancel, refund and expiry all call RestoreFoodStockAsync so food stock is never leaked.
    file: "Cinema/2-Business/Cinema.Business/Managers/BookingManager.cs"
    must_contain:
      - pattern: 'RestoreFoodStockAsync(new[] { invoice }, "Cancelled"'
        rationale: "Cancel restores stock"
      - pattern: 'RestoreFoodStockAsync(new[] { invoice }, "Refunded"'
        rationale: "Refund restores stock"
      - pattern: 'RestoreFoodStockAsync(stale.ToList(), "Expired"'
        rationale: "Expired pending invoices restore stock"

  - id: SC-INV-09
    severity: P0
    description: >
      Storage plan Receive is only allowed from Approved, is guarded by the plan RowVersion (saved
      BEFORE any stock moves, so a concurrent second receive fails first), adds stock in ascending item
      order and writes Receive ledger rows inside a transaction.
    file: "Cinema/2-Business/Cinema.Business/Managers/StoragePlanManager.cs"
    method: "ReceiveAsync"
    must_contain:
      - pattern: "plan.Status != StoragePlanStatus.Approved"
        rationale: "Receive only from Approved"
      - pattern: "BeginTransactionAsync"
        rationale: "Plan status + stock + ledger are atomic"
      - pattern: "await SaveAsync(plan);"
        rationale: "Plan saved first; ConcurrencyConflictException (RowVersion) aborts before stock moves"
      - pattern: "OrderBy(i => i.FoodAndDrinkId)"
        rationale: "Ascending item order, deadlock-safe"
      - pattern: "StockMovementType.Receive"
        rationale: "Receive ledger rows"
      - pattern: "StoragePlanId = plan.Id"
        rationale: "Ledger row links back to its plan"

  - id: SC-INV-10
    severity: P0
    description: >
      The StoragePlan entity keeps its optimistic-concurrency RowVersion (mapped IsRowVersion) and
      SaveAsync maps ConcurrencyConflictException to a friendly error.
    files:
      - "Cinema/3-Data/Cinema.Data.Entities/Entities/StoragePlan.cs"
      - "Cinema/3-Data/Cinema.Data/Configurations/InventoryConfiguration.cs"
      - "Cinema/2-Business/Cinema.Business/Managers/StoragePlanManager.cs"
    must_contain:
      - pattern: "RowVersion"
        rationale: "Concurrency token on the plan"
      - pattern: "IsRowVersion()"
        rationale: "EF treats it as SQL rowversion"
      - pattern: "ConcurrencyConflictException"
        rationale: "Concurrent decision surfaces as a handled conflict"

  - id: SC-INV-11
    severity: P0
    description: >
      Plan state machine transitions stay one-directional: Submit only from Draft, Approve/Reject only
      from Submitted, Cancel only from Draft/Submitted/Approved.
    file: "Cinema/2-Business/Cinema.Business/Managers/StoragePlanManager.cs"
    must_contain:
      - pattern: "plan.Status != StoragePlanStatus.Draft"
        rationale: "Submit (and edit) only from Draft"
      - pattern: "plan.Status != StoragePlanStatus.Submitted"
        rationale: "Approve/Reject only from Submitted"
      - pattern: "plan.Status = StoragePlanStatus.Approved"
        rationale: "Approve transition"
      - pattern: "plan.Status = StoragePlanStatus.Rejected"
        rationale: "Reject transition"
      - pattern: "plan.Status = StoragePlanStatus.Cancelled"
        rationale: "Cancel transition"
      - pattern: "plan.Status = StoragePlanStatus.Received"
        rationale: "Receive transition"

  - id: SC-INV-12
    severity: P0
    description: >
      Approve/Reject (and inventory settings) are limited to RoleNames.StockApprovers
      (Admin + TheaterManager); theater staff cannot approve their own plans.
    file: "Cinema/1-Service/Cinema.Service.WebApiHost/Controllers/CinemaController.cs"
    must_contain:
      - pattern: "Authorize(Roles = RoleNames.StockApprovers)"
        rationale: "Approval endpoints exclude TheaterStaff"

  - id: SC-INV-13
    severity: P0
    description: >
      RoleNames.StockApprovers excludes TheaterStaff.
    file: "Cinema/2-Business/Cinema.Business.DTO/Auth/RoleNames.cs"
    must_contain:
      - pattern: 'StockApprovers = Admin + "," + TheaterManager;'
        rationale: "Approvers are exactly Admin and TheaterManager"
      - pattern: 'BackOffice = Admin + "," + TheaterManager + "," + TheaterStaff;'
        rationale: "Back-office = all three roles"

  - id: SC-INV-14
    severity: P0
    description: >
      Inventory / combo-adjacent / storage-plan controller actions resolve the caller's theater scope with
      TryGetBackOfficeScope and answer Forbid() (403) when it fails. Never 401: the frontend logs the user
      out on a 401.
    file: "Cinema/1-Service/Cinema.Service.WebApiHost/Controllers/CinemaController.cs"
    must_contain:
      - pattern: "User.TryGetBackOfficeScope(out var scope)"
        rationale: "Staff/manager pinned to their own theater, admin unscoped"
      - pattern: "Task.FromResult<IActionResult>(Forbid())"
        rationale: "Scope failure is 403"
    must_not_contain:
      - pattern: "Unauthorized("
        rationale: "A 401 on scope failure would log the user out in the SPA"
      - pattern: "StatusCode(401"
        rationale: "Same: scope failure must be 403"

  - id: SC-INV-15
    severity: P0
    description: >
      TryGetBackOfficeScope: admin -> unscoped; staff/manager -> their theater claim (false when the
      claim is missing); anyone else -> false.
    file: "Cinema/1-Service/Cinema.Service.WebApiHost/Helpers/ClaimsPrincipalExtensions.cs"
    method: "TryGetBackOfficeScope"
    must_contain:
      - pattern: "principal.IsAdmin()"
        rationale: "Admin sees all theaters"
      - pattern: "principal.IsTheaterStaff() || principal.IsTheaterManager()"
        rationale: "Both roles are theater-pinned"
      - pattern: "return theaterScope != null;"
        rationale: "Staff/manager token without a theater claim is refused"

  - id: SC-INV-16
    severity: P0
    description: >
      Out-of-scope plans/items look like "not found" to staff (they cannot probe other theaters).
    file: "Cinema/2-Business/Cinema.Business/Managers/StoragePlanManager.cs"
    must_contain:
      - pattern: "theaterScope.HasValue && plan.TheaterId != theaterScope.Value"
        rationale: "Plan loads are theater-scoped"
      - pattern: "KeyNotFoundException"
        rationale: "Out-of-scope reads as missing"

  - id: SC-INV-17
    severity: P0
    description: >
      The generic food Create/Update requests carry NO inventory or combo fields: stock/tracking and
      recipes are changed only through the dedicated Inventory / Combo endpoints (so a plain edit can
      never overwrite QuantityOnHand or flip IsCombo).
    file: "Cinema/2-Business/Cinema.Business.DTO/Catalog/FoodAndDrinkDTOs.cs"
    must_contain:
      - pattern: "class CreateFoodAndDrinkRequest"
        rationale: "Request type exists"
      - pattern: "class UpdateFoodAndDrinkRequest"
        rationale: "Request type exists"
    forbidden_patterns:
      - regex: '(?s)class (Create|Update)FoodAndDrinkRequest[^}]*(TrackInventory|QuantityOnHand|LowStockThreshold|TargetStockLevel|IsCombo)'
        rationale: "Inventory/combo fields must not be accepted on generic food create/update"

  - id: SC-INV-18
    severity: P0
    description: >
      Combos are never tracked and never nested: SaveAsync rejects nested components and cross-theater
      components; InventoryManager refuses settings/movements on a combo; storage plans refuse combos.
    files:
      - "Cinema/2-Business/Cinema.Business/Managers/ComboManager.cs"
      - "Cinema/2-Business/Cinema.Business/Managers/InventoryManager.cs"
      - "Cinema/2-Business/Cinema.Business/Managers/StoragePlanManager.cs"
    must_contain:
      - pattern: "combos cannot be nested"
        rationale: "A component may not itself be a combo"
      - pattern: "belongs to a different theater than the combo"
        rationale: "Recipes stay within one theater"
      - pattern: "A combo holds no stock of its own"
        rationale: "Inventory writes on a combo are refused"
      - pattern: "food.IsCombo"
        rationale: "Receive refuses combo lines"

  - id: SC-INV-19
    severity: P1
    description: >
      Theater of a combo, a component or a stock-bearing item cannot be changed (recipes and the ledger
      are theater-scoped).
    file: "Cinema/2-Business/Cinema.Business/Managers/FoodAndDrinkManager.cs"
    method: "EnsureTheaterCanChangeAsync"
    must_contain:
      - pattern: "A combo cannot be moved to another theater."
        rationale: "Combo pinned to theater"
      - pattern: "GetCombosUsingAsync"
        rationale: "Components used in a combo are pinned"
      - pattern: "StockMovementStore.ExistsAsync"
        rationale: "Items with stock history are pinned"

  - id: SC-INV-20
    severity: P1
    description: >
      Inventory settings change tracked config only (never QuantityOnHand directly); turning tracking
      on requires an opening quantity which is applied as a ledger-recorded delta.
    file: "Cinema/2-Business/Cinema.Business/Managers/InventoryManager.cs"
    must_contain:
      - pattern: "An opening quantity is required when inventory tracking is turned on."
        rationale: "No tracking without a baseline"
      - pattern: "ApplyAndRecordAsync"
        rationale: "Opening/adjust/count all go through the single stock-write helper"

  - id: SC-INV-21
    severity: P1
    description: >
      Frontend: the CinemaStaff warehouse feature module exists with its storage-plan pages, and the food dialog
      (theaters) still exists to edit name/price only.
    files:
      - "projects/CinemaStaff/src/app/features/warehouse/warehouse.module.ts"
      - "projects/CinemaAdmin/src/app/features/modules/overview/theaters/food-and-drink.dialog.ts"
    must_contain:
      - pattern: "WarehouseModule"
        rationale: "Warehouse lazy module (CinemaStaff)"
      - pattern: "FoodAndDrinkDialog"
        rationale: "Food dialog component"

