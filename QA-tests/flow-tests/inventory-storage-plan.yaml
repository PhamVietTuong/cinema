# ─────────────────────────────────────────────────────────────────────────────
# §4 — Manual E2E playbook
# ─────────────────────────────────────────────────────────────────────────────
playbook:
  prerequisites:
    - "Backend on http://localhost:5102 with the inventory schema applied (upgrade_db.sql / create_db.sql); seed accounts created"
    - "FE: ng serve CinemaStaff (http://localhost:4203, the Warehouse lives here), ng serve CinemaAdmin (http://localhost:4201, Admin-only) and ng serve CinemaUser (http://localhost:4202)"
    - "Accounts: admin@cinema.vn, a TheaterManager and a TheaterStaff pinned to theater A, plus user@cinema.vn; theater B exists with its own food"
    - "Theater A has two foods (e.g. Popcorn, Cola) and an upcoming showtime"
  scenarios:
    - id: PB-INV-01
      title: "Enable tracking with an opening quantity"
      severity: P0
      steps:
        - step: 1
          action: "Admin -> Inventory -> open Popcorn -> turn tracking on WITHOUT an opening quantity"
          expected: ["Rejected: an opening quantity is required"]
        - step: 2
          action: "Turn tracking on with opening quantity 10, low-stock threshold 3"
          expected:
            - "QuantityOnHand = 10"
            - "Ledger shows one movement of +10 (opening)"
        - step: 3
          action: "Manual adjust -20 (more than on hand)"
          expected: ["Rejected; quantity still 10, no new ledger row"]

    - id: PB-INV-02
      title: "Define a combo; combos cannot be tracked or nested"
      severity: P0
      steps:
        - step: 1
          action: "Create food 'Combo 1' and save its composition: 2 x Popcorn + 1 x Cola"
          expected: ["Combo saved; combo shows an availability derived from its components"]
        - step: 2
          action: "Try to enable tracking on the combo; try to add another combo as a component; try a component from theater B"
          expected: ["All three refused (combo holds no stock / cannot be nested / different theater)"]
        - step: 3
          action: "Edit the combo's name/price in the generic food dialog"
          expected: ["Saved; QuantityOnHand/TrackInventory/recipe unchanged (dialog has no inventory fields)"]

    - id: PB-INV-03
      title: "Booking deducts stock (plain item and combo) in one transaction"
      severity: P0
      steps:
        - step: 1
          action: "As user@cinema.vn book seats + 1 Combo 1 + 1 Popcorn (Popcorn tracked, qty 10, Cola tracked)"
          expected:
            - "Popcorn on hand = 10 - 2 (combo) - 1 = 7; Cola reduced by 1"
            - "Sale ledger rows (negative) reference the invoice; combo row shows 'via combo' in the reason"
        - step: 2
          action: "Order more than is on hand (e.g. 8 more Popcorn)"
          expected: ["Booking refused with 'out of stock'; no seats held, no stock change, no ledger rows"]
        - step: 3
          action: "Two users order the last units at the same time"
          expected: ["Exactly one succeeds; quantity never negative"]

    - id: PB-INV-04
      title: "Cancel / refund / expiry restore the stock exactly once"
      severity: P0
      steps:
        - step: 1
          action: "Cancel the pending invoice from PB-INV-03"
          expected: ["Popcorn back to 10, Cola back; compensating positive ledger rows linked to the invoice"]
        - step: 2
          action: "Change the combo recipe, then cancel an invoice that was sold under the OLD recipe"
          expected: ["Restored quantities match what was sold (ledger), not the new recipe"]
        - step: 3
          action: "Trigger cancel/refund/expiry a second time for the same invoice"
          expected: ["No double restore; quantity unchanged"]

    - id: PB-INV-05
      title: "Storage plan lifecycle"
      severity: P0
      steps:
        - step: 1
          action: "As TheaterStaff create a plan (Draft) with Popcorn x 20, then Submit"
          expected: ["Status Submitted; staff has no Approve/Reject buttons"]
        - step: 2
          action: "As TheaterStaff call ApproveStoragePlan directly"
          expected: ["403 Forbidden"]
        - step: 3
          action: "As TheaterManager Reject with a reason; staff edits and resubmits; manager Approves"
          expected: ["Rejected shows the reason; resubmit goes Draft->Submitted; Approved"]
        - step: 4
          action: "Receive with an actual quantity of 18"
          expected:
            - "Status Received; Popcorn +18; one Receive ledger row linked to the plan"
        - step: 5
          action: "Receive the same plan again (or from two tabs at once)"
          expected: ["Second attempt refused (not Approved / concurrency conflict); stock not added twice"]
        - step: 6
          action: "Cancel a Draft, Submitted and Approved plan; try to cancel a Received one"
          expected: ["First three Cancelled; Received refused"]

    - id: PB-INV-06
      title: "Back-office role scoping"
      severity: P0
      steps:
        - step: 1
          action: "Login as TheaterStaff of theater A -> Inventory and Storage plans"
          expected: ["Only theater A items/plans/movements are listed"]
        - step: 2
          action: "Call GetInventory / receive / adjust for a theater B item id with the staff token"
          expected: ["Not found / 403; no data from theater B leaks"]
        - step: 3
          action: "Use a staff token with no theater claim"
          expected: ["403 Forbidden (NOT 401) and the SPA does not log the user out"]
        - step: 4
          action: "Login as user@cinema.vn and call any Inventory endpoint"
          expected: ["403 Forbidden"]
        - step: 5
          action: "Login as admin"
          expected: ["All theaters visible"]

regression_indicators:
  - id: RI-INV-01
    description: "Stock changed outside TryApplyStockDeltaAsync -> negative stock / oversell / lost ledger"
    severity: P0
    detection: "static SC-INV-01, SC-INV-02, SC-INV-03 OR playbook PB-INV-01 step 3, PB-INV-03 step 3"
  - id: RI-INV-02
    description: "Ledger rows edited/deleted or missing -> restock and audit become wrong"
    severity: P0
    detection: "static SC-INV-03, SC-INV-04"
  - id: RI-INV-03
    description: "Deduction leaves the booking transaction or loses ascending order -> phantom stock loss / deadlocks"
    severity: P0
    detection: "static SC-INV-05, SC-INV-06 OR playbook PB-INV-03"
  - id: RI-INV-04
    description: "Restock reads the combo recipe, or is not idempotent -> wrong or doubled stock after cancel/refund/expiry"
    severity: P0
    detection: "static SC-INV-07, SC-INV-08 OR playbook PB-INV-04"
  - id: RI-INV-05
    description: "Receive allowed outside Approved or without the RowVersion guard -> stock added twice"
    severity: P0
    detection: "static SC-INV-09, SC-INV-10, SC-INV-11 OR playbook PB-INV-05 step 5"
  - id: RI-INV-06
    description: "Staff can approve/reject plans, or see/modify another theater -> privilege escalation / data leak"
    severity: P0
    detection: "static SC-INV-12, SC-INV-13, SC-INV-16 OR playbook PB-INV-05 step 2, PB-INV-06"
  - id: RI-INV-07
    description: "Scope failure answers 401 -> frontend logs the user out"
    severity: P0
    detection: "static SC-INV-14, SC-INV-15 OR playbook PB-INV-06 step 3"
  - id: RI-INV-08
    description: "Generic food edit accepts inventory/combo fields -> plain edit overwrites stock or flips combo"
    severity: P0
    detection: "static SC-INV-17 OR playbook PB-INV-02 step 3"
  - id: RI-INV-09
    description: "Combo tracked or nested -> double-counted / cyclic stock"
    severity: P0
    detection: "static SC-INV-18 OR playbook PB-INV-02 step 2"

reporting:
  output_path: "QA-tests/FLOW-TEST-RESULTS.md"
  alert_on_p0: true
  format: "markdown"
