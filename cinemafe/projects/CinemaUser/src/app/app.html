<nav class="topbar">
  <div class="topbar-inner">
    <a routerLink="/" class="logo-link">
      <span class="logo-row"><i class="fas fa-film"></i><span>Midnight Premium</span></span>
      <span class="marquee-rule marquee-rule--sm">
        <i class="bulb"></i><i class="bulb"></i><i class="bulb"></i><i class="bulb"></i><i class="bulb"></i><i class="bulb"></i>
      </span>
    </a>
    <ul class="nav-links">
      <li><a routerLink="/movies" routerLinkActive="active-link">Phim</a></li>
      <li><a routerLink="/theaters" routerLinkActive="active-link">Rạp Chiếu</a></li>
      <li><a routerLink="/promotions" routerLinkActive="active-link">Khuyến Mãi</a></li>
      <li><a routerLink="/membership" routerLinkActive="active-link">Thành Viên</a></li>
    </ul>
    <div class="nav-actions">
      <ng-container *ngIf="isAuth$ | async; else guestNav">
        <button class="nav-user-btn" [matMenuTriggerFor]="userMenu">
          <i class="fas fa-circle-user"></i>
          <span>{{ (user$ | async)?.name }}</span>
          <i class="fas fa-chevron-down small-icon"></i>
        </button>
        <mat-menu #userMenu="matMenu">
          <a mat-menu-item routerLink="/profile">
            <i class="fas fa-user menu-icon"></i> Tài Khoản
          </a>
          <button mat-menu-item (click)="doLogout()">
            <i class="fas fa-right-from-bracket menu-icon"></i> Đăng Xuất
          </button>
        </mat-menu>
      </ng-container>
      <ng-template #guestNav>
        <a routerLink="/auth/login" class="nav-link-text">Đăng Nhập</a>
        <a routerLink="/auth/register" class="btn-nav-primary">Đăng Ký</a>
      </ng-template>
    </div>

    <!-- Mobile hamburger -->
    <button class="nav-burger" type="button" (click)="toggleMenu()" aria-label="Menu">
      <i class="fas" [class.fa-bars]="!menuOpen" [class.fa-xmark]="menuOpen"></i>
    </button>
  </div>

  <!-- Mobile menu panel -->
  <div class="mobile-menu" [class.is-open]="menuOpen">
    <a routerLink="/movies" routerLinkActive="active-link" (click)="closeMenu()">Phim</a>
    <a routerLink="/theaters" routerLinkActive="active-link" (click)="closeMenu()">Rạp Chiếu</a>
    <a routerLink="/promotions" routerLinkActive="active-link" (click)="closeMenu()">Khuyến Mãi</a>
    <a routerLink="/membership" routerLinkActive="active-link" (click)="closeMenu()">Thành Viên</a>
    <div class="mobile-menu-divider"></div>
    <ng-container *ngIf="isAuth$ | async; else guestMobile">
      <a routerLink="/profile" (click)="closeMenu()">Tài Khoản</a>
      <button type="button" (click)="doLogout()">Đăng Xuất</button>
    </ng-container>
    <ng-template #guestMobile>
      <a routerLink="/auth/login" (click)="closeMenu()">Đăng Nhập</a>
      <a routerLink="/auth/register" (click)="closeMenu()">Đăng Ký</a>
    </ng-template>
  </div>
</nav>
<div class="mobile-menu-scrim" *ngIf="menuOpen" (click)="closeMenu()"></div>

<router-outlet></router-outlet>
