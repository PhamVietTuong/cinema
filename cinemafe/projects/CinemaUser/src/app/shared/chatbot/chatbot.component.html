<!-- Floating toggle -->
<button type="button" class="cb-fab" (click)="toggle()" [attr.aria-label]="(open ? 'chatbot.closeAssistant' : 'chatbot.openAssistant') | translate">
  <i class="fas" [class.fa-comment-dots]="!open" [class.fa-xmark]="open"></i>
</button>

<!-- Chat panel -->
<div class="cb-panel" *ngIf="open">
  <div class="cb-head">
    <span class="cb-title"><i class="fas fa-headset"></i> {{ 'chatbot.title' | translate }}</span>
    <button type="button" class="cb-close" (click)="toggle()" [attr.aria-label]="'common.close' | translate"><i class="fas fa-xmark"></i></button>
  </div>

  <div class="cb-body">
    <div class="cb-msg" *ngFor="let m of messages" [class.cb-msg--user]="m.from === 'user'">
      <span class="cb-bubble">{{ m.text }}</span>
    </div>
  </div>

  <div class="cb-quick">
    <button type="button" class="cb-chip" *ngFor="let q of quickReplies" (click)="sendQuick(q)">{{ q.label | translate }}</button>
  </div>

  <form class="cb-input" (ngSubmit)="send()">
    <input [(ngModel)]="input" name="cbInput" [placeholder]="'chatbot.inputPlaceholder' | translate" autocomplete="off">
    <button type="submit" [disabled]="!input.trim()" [attr.aria-label]="'chatbot.send' | translate"><i class="fas fa-paper-plane"></i></button>
  </form>
</div>
