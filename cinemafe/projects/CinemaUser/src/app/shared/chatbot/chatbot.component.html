<!-- Floating toggle -->
<button type="button" class="cb-fab" (click)="toggle()" [attr.aria-label]="(open ? 'chatbot.closeAssistant' : 'chatbot.openAssistant') | translate">
  <mat-icon>{{ open ? 'close' : 'chat' }}</mat-icon>
</button>

<!-- Chat panel -->
<div class="cb-panel" *ngIf="open">
  <div class="cb-head">
    <span class="cb-title"><mat-icon>support_agent</mat-icon> {{ 'chatbot.title' | translate }}</span>
    <button mat-icon-button type="button" class="cb-close" (click)="toggle()" [attr.aria-label]="'common.close' | translate"><mat-icon>close</mat-icon></button>
  </div>

  <div class="cb-body" #body>
    <div class="cb-msg" *ngFor="let m of messages" [class.cb-msg--user]="m.from === 'user'">
      <span class="cb-bubble">{{ m.text }}</span>
    </div>
  </div>

  <div class="cb-quick">
    <button type="button" class="cb-chip" *ngFor="let q of quickReplies" (click)="sendQuick(q)">{{ q.label | translate }}</button>
  </div>

  <form class="cb-input" (ngSubmit)="send()">
    <mat-form-field appearance="outline">
      <input matInput [(ngModel)]="input" name="cbInput" [placeholder]="'chatbot.inputPlaceholder' | translate" autocomplete="off">
    </mat-form-field>
    <button mat-icon-button type="submit" [disabled]="!input.trim()" [attr.aria-label]="'chatbot.send' | translate"><mat-icon>send</mat-icon></button>
  </form>
</div>
