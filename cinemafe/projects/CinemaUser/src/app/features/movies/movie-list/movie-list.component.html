<div class="page-header">
  <div class="page-header-inner">
    <h1 class="page-title">{{ title }}</h1>
    <div class="search-row" *ngIf="isPaged">
      <span class="search-box">
        <i class="fas fa-magnifying-glass"></i>
        <input [formControl]="searchCtrl" placeholder="Tìm phim, đạo diễn, diễn viên...">
      </span>
    </div>
  </div>
</div>

<div class="movies-page">
  <div *ngIf="loading$ | async" class="spinner-wrap">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <div class="movie-grid">
    <div class="movie-card" *ngFor="let movie of movies$ | async" [routerLink]="['/movies', movie.id]">
      <div class="card-poster">
        <img [src]="movie.posterUrl || 'assets/no-poster.jpg'" [alt]="movie.title">
        <div class="card-hover-overlay">
          <span class="btn-book-small"><i class="fas fa-ticket"></i> Đặt Vé</span>
        </div>
        <div class="card-rating" *ngIf="movie.averageRating"><i class="fas fa-star"></i> {{ movie.averageRating | number:'1.1-1' }}</div>
        <span class="card-age" *ngIf="movie.ageRestrictionCode">{{ movie.ageRestrictionCode }}</span>
      </div>
      <div class="card-info">
        <h3 class="card-title">{{ movie.title }}</h3>
        <div class="card-genres">
          <span class="chip-genre" *ngFor="let g of movie.genres | slice:0:2">{{ g }}</span>
        </div>
        <p class="card-duration"><i class="fas fa-clock"></i> {{ movie.duration }} phút</p>
      </div>
    </div>
  </div>

  <div *ngIf="(movies$ | async)?.length === 0 && !(loading$ | async)" class="empty">
    <i class="fas fa-film"></i>
    <p>Không có phim nào.</p>
  </div>

  <div class="pager" *ngIf="isPaged && (pagedMovies$ | async) as paged">
    <mat-paginator [length]="paged.total" [pageSize]="pageSize" (page)="onPageChange($event)" showFirstLastButtons></mat-paginator>
  </div>
</div>
