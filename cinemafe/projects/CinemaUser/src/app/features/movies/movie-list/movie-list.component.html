<div class="page-container">
  <div class="search-bar">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Tìm kiếm phim...</mat-label>
      <mat-icon matPrefix>search</mat-icon>
      <input matInput [formControl]="searchCtrl" placeholder="Tên phim, đạo diễn, diễn viên...">
    </mat-form-field>
  </div>

  <div *ngIf="loading$ | async" class="spinner-wrap">
    <mat-spinner></mat-spinner>
  </div>

  <ng-container *ngIf="pagedMovies$ | async as paged">
    <div class="movie-grid">
      <mat-card *ngFor="let movie of paged.items" class="movie-card" [routerLink]="['/movies', movie.id]">
        <img mat-card-image [src]="movie.posterUrl || '/assets/no-poster.jpg'" [alt]="movie.title">
        <mat-card-content>
          <h3>{{ movie.title }}</h3>
          <div class="genre-chips">
            <mat-chip *ngFor="let g of movie.genres" size="small">{{ g }}</mat-chip>
          </div>
          <p class="movie-meta">
            <span><i class="fas fa-clock"></i> {{ movie.duration }}min</span>
            <span class="age-badge">{{ movie.ageRestrictionCode }}</span>
            <span><i class="fas fa-star"></i> {{ movie.averageRating | number:'1.1-1' }}</span>
          </p>
        </mat-card-content>
        <mat-card-actions>
          <button mat-flat-button color="primary" class="full-width" [routerLink]="['/movies', movie.id]">
            <i class="fas fa-ticket"></i> Đặt Vé
          </button>
        </mat-card-actions>
      </mat-card>
    </div>
    <mat-paginator
      [length]="paged.total"
      [pageSize]="pageSize"
      (page)="onPageChange($event)"
      showFirstLastButtons>
    </mat-paginator>
  </ng-container>
</div>
