<app-modal [open]="open" [title]="editingId ? 'Chỉnh Sửa Người Dùng' : 'Người Dùng Mới'" (closed)="cancel()">
  <form [formGroup]="form" (ngSubmit)="save()" class="user-form">
    <div class="ad-field full-span">
      <label class="ad-label">Họ Tên</label>
      <input class="ad-input" formControlName="name" placeholder="Nguyễn Văn A">
    </div>

    <div class="ad-field" *ngIf="!editingId">
      <label class="ad-label">Email</label>
      <input class="ad-input" formControlName="email" placeholder="user@cinema.vn">
      <span class="ad-field-err" *ngIf="form.get('email')?.touched && form.get('email')?.hasError('email')">Email không hợp lệ.</span>
    </div>
    <div class="ad-field">
      <label class="ad-label">Số Điện Thoại</label>
      <input class="ad-input" formControlName="phone" placeholder="0901234567">
      <span class="ad-field-err" *ngIf="form.get('phone')?.touched && form.get('phone')?.hasError('pattern')">Số điện thoại không hợp lệ.</span>
    </div>
    <div class="ad-field" *ngIf="!editingId">
      <label class="ad-label">Mật Khẩu</label>
      <input class="ad-input" type="password" formControlName="password" placeholder="Tối thiểu 6 ký tự">
      <span class="ad-field-err" *ngIf="form.get('password')?.touched && form.get('password')?.hasError('minlength')">Mật khẩu tối thiểu 6 ký tự.</span>
    </div>

    <div class="ad-field">
      <label class="ad-label">Vai Trò</label>
      <select class="ad-input" formControlName="userTypeId">
        <option value="">— Chọn vai trò —</option>
        <option *ngFor="let t of userTypes" [value]="t.id">{{ t.name }}</option>
      </select>
    </div>
    <div class="ad-field">
      <label class="ad-label">Trạng Thái</label>
      <select class="ad-input" formControlName="status">
        <option *ngFor="let s of statuses" [ngValue]="s.v">{{ s.label }}</option>
      </select>
    </div>

    <p class="ad-field-err full-span" *ngIf="errorMsg">{{ errorMsg }}</p>

    <div class="form-actions full-span">
      <button class="ad-btn ad-btn--primary" type="submit">Lưu</button>
      <button class="ad-btn ad-btn--ghost" type="button" (click)="cancel()">Hủy</button>
    </div>
  </form>
</app-modal>
