<app-modal [open]="open" [title]="editingId ? ('users.form.editTitle' | translate) : ('users.form.createTitle' | translate)" (closed)="cancel()">
  <form [formGroup]="form" (ngSubmit)="save()" class="user-form">
    <div class="ad-field full-span">
      <label class="ad-label">{{ 'common.name' | translate }}</label>
      <input class="ad-input" formControlName="name" [placeholder]="'users.form.namePlaceholder' | translate">
    </div>

    <div class="ad-field" *ngIf="!editingId">
      <label class="ad-label">{{ 'users.form.email' | translate }}</label>
      <input class="ad-input" formControlName="email" [placeholder]="'users.form.emailPlaceholder' | translate">
      <span class="ad-field-err" *ngIf="form.get('email')?.touched && form.get('email')?.hasError('email')">{{ 'users.form.emailInvalid' | translate }}</span>
    </div>
    <div class="ad-field">
      <label class="ad-label">{{ 'users.form.phone' | translate }}</label>
      <input class="ad-input" formControlName="phone" placeholder="0901234567">
      <span class="ad-field-err" *ngIf="form.get('phone')?.touched && form.get('phone')?.hasError('pattern')">{{ 'users.form.phoneInvalid' | translate }}</span>
    </div>
    <div class="ad-field" *ngIf="!editingId">
      <label class="ad-label">{{ 'users.form.password' | translate }}</label>
      <input class="ad-input" type="password" formControlName="password" [placeholder]="'users.form.passwordPlaceholder' | translate">
      <span class="ad-field-err" *ngIf="form.get('password')?.touched && form.get('password')?.hasError('minlength')">{{ 'users.form.passwordMinLength' | translate }}</span>
    </div>

    <div class="ad-field">
      <label class="ad-label">{{ 'users.form.role' | translate }}</label>
      <select class="ad-input" formControlName="userTypeId">
        <option value="">{{ 'users.form.selectRole' | translate }}</option>
        <option *ngFor="let t of userTypes" [value]="t.id">{{ t.name }}</option>
      </select>
    </div>
    <div class="ad-field">
      <label class="ad-label">{{ 'common.status' | translate }}</label>
      <select class="ad-input" formControlName="status">
        <option *ngFor="let s of statuses" [ngValue]="s.v">{{ s.label }}</option>
      </select>
    </div>

    <p class="ad-field-err full-span" *ngIf="errorMsg">{{ errorMsg }}</p>

    <div class="form-actions full-span">
      <button class="ad-btn ad-btn--primary" type="submit">{{ 'common.save' | translate }}</button>
      <button class="ad-btn ad-btn--ghost" type="button" (click)="cancel()">{{ 'common.cancel' | translate }}</button>
    </div>
  </form>
</app-modal>
