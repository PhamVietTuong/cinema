<div class="ad-page">
  <div class="ad-page-header">
    <div>
      <h1 class="ad-h1">Hồ Sơ Của Tôi</h1>
      <p class="ad-sub">Quản lý thông tin tài khoản quản trị viên.</p>
    </div>
  </div>

  <div class="profile-layout">
    <!-- Identity card -->
    <div class="ad-card id-card">
      <span class="ad-avatar id-avatar">{{ initials(user?.name) }}</span>
      <div class="id-name">{{ user?.name || '—' }}</div>
      <div class="id-email">{{ user?.email }}</div>
      <span class="ad-pill ad-pill--violet no-dot">{{ user?.userTypeName || 'Quản Trị Viên' }}</span>

      <nav class="id-tabs">
        <button class="ad-btn" [class.ad-btn--primary]="tab === 'info'" [class.ad-btn--ghost]="tab !== 'info'" (click)="tab = 'info'">
          <mat-icon>person</mat-icon> Thông Tin
        </button>
        <button class="ad-btn" [class.ad-btn--primary]="tab === 'password'" [class.ad-btn--ghost]="tab !== 'password'" (click)="tab = 'password'">
          <mat-icon>lock</mat-icon> Đổi Mật Khẩu
        </button>
      </nav>
    </div>

    <!-- Content -->
    <div class="ad-card content-card">
      <ng-container *ngIf="tab === 'info'">
        <h3 class="ad-card-title">Thông Tin Cá Nhân</h3>
        <form class="ad-form" [formGroup]="profileForm" (ngSubmit)="saveProfile()">
          <div class="ad-field">
            <label class="ad-label">Họ và tên</label>
            <input class="ad-input" type="text" formControlName="name" placeholder="Quản trị viên">
          </div>
          <div class="ad-field">
            <label class="ad-label">Email</label>
            <input class="ad-input" type="text" [value]="user?.email || ''" disabled>
          </div>
          <div class="ad-field">
            <label class="ad-label">Số điện thoại</label>
            <input class="ad-input" type="text" formControlName="phone" placeholder="0901234567">
          </div>
          <div class="ad-field">
            <label class="ad-label">Ảnh đại diện (URL)</label>
            <input class="ad-input" type="text" formControlName="avatar" placeholder="https://...">
          </div>

          <p class="msg ok" *ngIf="profileMsg">{{ profileMsg }}</p>
          <p class="msg err" *ngIf="profileErr">{{ profileErr }}</p>

          <div class="form-actions">
            <button class="ad-btn ad-btn--primary" type="submit" [disabled]="profileForm.invalid">Lưu Thay Đổi</button>
          </div>
        </form>
      </ng-container>

      <ng-container *ngIf="tab === 'password'">
        <h3 class="ad-card-title">Đổi Mật Khẩu</h3>
        <form class="ad-form" [formGroup]="passwordForm" (ngSubmit)="changePassword()">
          <div class="ad-field">
            <label class="ad-label">Mật khẩu hiện tại</label>
            <input class="ad-input" type="password" formControlName="currentPassword" autocomplete="current-password">
          </div>
          <div class="ad-field">
            <label class="ad-label">Mật khẩu mới</label>
            <input class="ad-input" type="password" formControlName="newPassword" autocomplete="new-password">
          </div>
          <div class="ad-field">
            <label class="ad-label">Xác nhận mật khẩu mới</label>
            <input class="ad-input" type="password" formControlName="confirmNewPassword" autocomplete="new-password">
          </div>

          <p class="msg ok" *ngIf="passwordMsg">{{ passwordMsg }}</p>
          <p class="msg err" *ngIf="passwordErr">{{ passwordErr }}</p>

          <div class="form-actions">
            <button class="ad-btn ad-btn--primary" type="submit" [disabled]="passwordForm.invalid">Cập Nhật Mật Khẩu</button>
          </div>
        </form>
      </ng-container>
    </div>
  </div>
</div>
