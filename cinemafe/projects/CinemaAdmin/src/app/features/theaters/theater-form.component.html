<app-modal [open]="open" [title]="(editingId ? 'theaters.form.editTitle' : 'theaters.form.createTitle') | translate" (closed)="cancel()">
  <form [formGroup]="form" (ngSubmit)="save()" class="theater-form">
    <div class="ad-field">
      <label class="ad-label">{{ 'theaters.form.nameLabel' | translate }}</label>
      <input class="ad-input" formControlName="name" [placeholder]="'theaters.form.namePlaceholder' | translate">
    </div>
    <div class="ad-field">
      <label class="ad-label">{{ 'theaters.form.cityLabel' | translate }}</label>
      <input class="ad-input" formControlName="city" [placeholder]="'theaters.form.cityPlaceholder' | translate">
    </div>
    <div class="ad-field full-span">
      <label class="ad-label">{{ 'theaters.form.addressLabel' | translate }}</label>
      <input class="ad-input" formControlName="address" [placeholder]="'theaters.form.addressPlaceholder' | translate">
    </div>
    <div class="ad-field">
      <label class="ad-label">{{ 'theaters.form.phoneLabel' | translate }}</label>
      <input class="ad-input" formControlName="phone" placeholder="0123456789">
      <span class="ad-field-err" *ngIf="form.get('phone')?.touched && form.get('phone')?.hasError('pattern')">{{ 'theaters.form.phoneInvalid' | translate }}</span>
    </div>
    <div class="ad-field">
      <label class="ad-label">{{ 'theaters.form.emailLabel' | translate }}</label>
      <input class="ad-input" formControlName="email" placeholder="rap@cinema.vn">
      <span class="ad-field-err" *ngIf="form.get('email')?.touched && form.get('email')?.hasError('email')">{{ 'theaters.form.emailInvalid' | translate }}</span>
    </div>
    <div class="ad-field full-span">
      <label class="ad-label">{{ 'theaters.form.imageLabel' | translate }}</label>
      <input class="ad-input" formControlName="imageUrl" [placeholder]="'theaters.form.imagePlaceholder' | translate">
      <div class="img-upload-row">
        <label class="ad-btn ad-btn--ghost">
          <mat-icon>upload</mat-icon> {{ 'theaters.form.uploadImage' | translate }}
          <input type="file" accept="image/*" hidden (change)="onPickImage($event)">
        </label>
        <span class="img-upload-status" *ngIf="uploading">{{ 'theaters.form.uploading' | translate }}</span>
        <span class="img-upload-status err" *ngIf="uploadError">{{ uploadError }}</span>
      </div>
      <div class="img-preview" *ngIf="form.value.imageUrl">
        <img [src]="form.value.imageUrl" alt="">
      </div>
    </div>
    <div class="form-actions full-span">
      <button class="ad-btn ad-btn--primary" type="submit">{{ 'common.save' | translate }}</button>
      <button class="ad-btn ad-btn--ghost" type="button" (click)="cancel()">{{ 'common.cancel' | translate }}</button>
    </div>
  </form>
</app-modal>
