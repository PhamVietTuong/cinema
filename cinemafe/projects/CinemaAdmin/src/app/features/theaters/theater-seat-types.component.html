<div class="tab-toolbar">
  <p class="ad-sub">Các hạng ghế của rạp này (giá vé = giá gốc × hệ số).</p>
  <button class="ad-btn ad-btn--primary" (click)="openCreate()"><mat-icon>add</mat-icon> Thêm Loại Ghế</button>
</div>

<app-modal [open]="showForm" (closed)="cancelEdit()">
<div class="ad-card form-card">
  <h3 class="ad-card-title">{{ editingId ? 'Chỉnh Sửa Loại Ghế' : 'Loại Ghế Mới' }}</h3>
  <form [formGroup]="form" (ngSubmit)="save()" class="catalog-form">
    <div class="ad-field">
      <label class="ad-label">Tên Loại Ghế</label>
      <input class="ad-input" formControlName="name" placeholder="VD: VIP">
    </div>
    <div class="ad-field">
      <label class="ad-label">Màu Hiển Thị</label>
      <input class="ad-input" type="color" formControlName="color">
    </div>
    <div class="ad-field">
      <label class="ad-label">Hệ Số Giá</label>
      <input class="ad-input" type="number" step="0.1" min="0.1" formControlName="priceMultiplier" placeholder="1.0">
    </div>
    <div class="ad-field full-span">
      <label class="ad-label">Mô Tả</label>
      <input class="ad-input" formControlName="description" placeholder="Ghế đôi, vị trí trung tâm...">
    </div>
    <div class="form-actions full-span">
      <button class="ad-btn ad-btn--primary" type="submit">Lưu</button>
      <button class="ad-btn ad-btn--ghost" type="button" (click)="cancelEdit()">Hủy</button>
    </div>
  </form>
</div>
</app-modal>
<app-confirm-modal [open]="confirmOpen" message="Bạn có chắc muốn xóa mục này?" (confirmed)="confirmDelete()" (closed)="confirmOpen = false"></app-confirm-modal>

<div class="ad-card ad-card--pad-0">
  <div class="ad-table-wrap">
    <table class="ad-table">
      <thead>
        <tr><th>Màu</th><th>Tên Loại Ghế</th><th>Hệ Số Giá</th><th>Mô Tả</th><th class="ad-td-actions">Thao Tác</th></tr>
      </thead>
      <tbody>
        <tr *ngFor="let x of items">
          <td><span class="color-dot" [style.background]="x.color"></span></td>
          <td><strong>{{ x.name }}</strong></td>
          <td>×{{ x.priceMultiplier | number:'1.0-2' }}</td>
          <td>{{ x.description || '—' }}</td>
          <td class="ad-td-actions">
            <button class="ad-icon-btn is-primary" (click)="edit(x)" title="Sửa"><mat-icon>edit</mat-icon></button>
            <button class="ad-icon-btn" (click)="delete(x.id)" title="Xóa"><mat-icon>delete</mat-icon></button>
          </td>
        </tr>
      </tbody>
    </table>
    <div *ngIf="!items.length" class="ad-empty"><mat-icon>event_seat</mat-icon><p>Rạp này chưa có loại ghế nào.</p></div>
  </div>
</div>
