<div class="ad-page">
  <div class="ad-page-header">
    <div>
      <h1 class="ad-h1">Quản Lý Rạp Chiếu</h1>
      <p class="ad-sub">Danh sách hệ thống rạp chiếu phim.</p>
    </div>
    <div class="ad-toolbar">
      <span class="ad-search">
        <mat-icon>search</mat-icon>
        <input class="ad-input" [(ngModel)]="search" placeholder="Tìm rạp...">
      </span>
      <button class="ad-btn ad-btn--primary" (click)="openCreate()"><mat-icon>add</mat-icon> Thêm Rạp</button>
    </div>
  </div>

  <!-- Table -->
  <div class="ad-card ad-card--pad-0">
    <div class="ad-table-wrap">
      <table class="ad-table">
        <thead>
          <tr><th>Ảnh</th><th>Tên Rạp</th><th>Thành Phố</th><th>Địa Chỉ</th><th>Số Phòng</th><th>Trạng Thái</th><th class="ad-td-actions">Thao Tác</th></tr>
        </thead>
        <tbody>
          <tr *ngFor="let t of filtered">
            <td>
              <span class="theater-thumb">
                <img *ngIf="t.imageUrl" [src]="t.imageUrl" [alt]="t.name">
                <mat-icon *ngIf="!t.imageUrl">theaters</mat-icon>
              </span>
            </td>
            <td><strong>{{ t.name }}</strong></td>
            <td>{{ t.city || '—' }}</td>
            <td class="addr">{{ t.address || '—' }}</td>
            <td>{{ t.roomCount ?? 0 }} phòng</td>
            <td>
              <span class="ad-pill" [class.ad-pill--success]="t.isActive" [class.ad-pill--neutral]="!t.isActive">
                {{ t.isActive ? 'Hoạt Động' : 'Tạm Ngưng' }}
              </span>
            </td>
            <td class="ad-td-actions">
              <button class="ad-icon-btn is-primary" (click)="editTheater(t)" title="Sửa"><mat-icon>edit</mat-icon></button>
            </td>
          </tr>
        </tbody>
      </table>
      <div *ngIf="!filtered.length" class="ad-empty"><mat-icon>theaters</mat-icon><p>Chưa có rạp nào.</p></div>
    </div>
  </div>
</div>

<!-- Create / edit form (separate component), shown as a popup -->
<app-theater-form [open]="showForm" [theater]="editing" (saved)="onSaved()" (closed)="showForm = false"></app-theater-form>
