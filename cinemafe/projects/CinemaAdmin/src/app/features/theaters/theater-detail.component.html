<div class="ad-page">
  <div class="ad-page-header">
    <div>
      <button class="ad-btn ad-btn--ghost" (click)="goBack()"><mat-icon>arrow_back</mat-icon> Danh Sách Rạp</button>
      <h1 class="ad-h1">{{ form.value.name || 'Chi Tiết Rạp' }}</h1>
      <p class="ad-sub">Thông tin rạp và danh sách phòng chiếu.</p>
    </div>
  </div>

  <!-- Theater information (editable) — always shown at the top -->
  <div class="ad-card">
    <h3 class="ad-card-title">Thông Tin Rạp</h3>
    <form [formGroup]="form" (ngSubmit)="save()" class="theater-form">
      <div class="ad-field">
        <label class="ad-label">Tên Rạp</label>
        <input class="ad-input" formControlName="name" placeholder="VD: CGV Vincom">
      </div>
      <div class="ad-field">
        <label class="ad-label">Thành Phố</label>
        <input class="ad-input" formControlName="city" placeholder="VD: Hà Nội">
      </div>
      <div class="ad-field full-span">
        <label class="ad-label">Địa Chỉ</label>
        <input class="ad-input" formControlName="address" placeholder="Số nhà, đường, quận...">
      </div>
      <div class="ad-field">
        <label class="ad-label">Số Điện Thoại</label>
        <input class="ad-input" formControlName="phone" placeholder="0123456789">
        <span class="ad-field-err" *ngIf="form.get('phone')?.touched && form.get('phone')?.hasError('pattern')">Số điện thoại không hợp lệ.</span>
      </div>
      <div class="ad-field">
        <label class="ad-label">Email</label>
        <input class="ad-input" formControlName="email" placeholder="rap@cinema.vn">
        <span class="ad-field-err" *ngIf="form.get('email')?.touched && form.get('email')?.hasError('email')">Email không hợp lệ.</span>
      </div>
      <div class="ad-field full-span">
        <label class="ad-label">Ảnh Rạp</label>
        <input class="ad-input" formControlName="imageUrl" placeholder="Dán URL hoặc tải ảnh lên">
        <div class="img-upload-row">
          <label class="ad-btn ad-btn--ghost">
            <mat-icon>upload</mat-icon> Tải Ảnh Lên
            <input type="file" accept="image/*" hidden (change)="onPickImage($event)">
          </label>
          <span class="img-upload-status" *ngIf="uploading">Đang tải...</span>
          <span class="img-upload-status err" *ngIf="uploadError">{{ uploadError }}</span>
        </div>
        <div class="img-preview" *ngIf="form.value.imageUrl">
          <img [src]="form.value.imageUrl" alt="">
        </div>
      </div>
      <div class="form-actions full-span">
        <button class="ad-btn ad-btn--primary" type="submit" [disabled]="saving">{{ saving ? 'Đang lưu…' : 'Lưu' }}</button>
      </div>
    </form>
  </div>

  <!-- Per-theater management tabs -->
  <mat-tab-group class="detail-tabs" animationDuration="150ms">
    <mat-tab label="Phòng Chiếu">
      <div class="tab-body">
        <app-theater-rooms [theaterId]="theaterId"></app-theater-rooms>
      </div>
    </mat-tab>
    <mat-tab label="Loại Phòng">
      <div class="tab-body">
        <app-theater-room-types [theaterId]="theaterId"></app-theater-room-types>
      </div>
    </mat-tab>
    <mat-tab label="Loại Ghế">
      <div class="tab-body">
        <app-theater-seat-types [theaterId]="theaterId"></app-theater-seat-types>
      </div>
    </mat-tab>
    <mat-tab label="Đồ Ăn & Thức Uống">
      <div class="tab-body">
        <app-theater-food [theaterId]="theaterId"></app-theater-food>
      </div>
    </mat-tab>
    <mat-tab label="Khung Giờ">
      <div class="tab-body">
        <app-theater-time-slots [theaterId]="theaterId"></app-theater-time-slots>
      </div>
    </mat-tab>
    <mat-tab label="Giá Vé">
      <div class="tab-body">
        <app-theater-ticket-prices [theaterId]="theaterId"></app-theater-ticket-prices>
      </div>
    </mat-tab>
  </mat-tab-group>
</div>
