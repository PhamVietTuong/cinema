<div class="tab-toolbar">
  <p class="ad-sub">Bắp, nước và combo bán tại rạp này.</p>
  <button class="ad-btn ad-btn--primary" (click)="openCreate()"><mat-icon>add</mat-icon> Thêm Món</button>
</div>

<app-modal [open]="showForm" (closed)="cancelEdit()">
<div class="ad-card form-card">
  <h3 class="ad-card-title">{{ editingId ? 'Chỉnh Sửa Món' : 'Món Mới' }}</h3>
  <form [formGroup]="form" (ngSubmit)="save()" class="catalog-form">
    <div class="ad-field">
      <label class="ad-label">Tên Món</label>
      <input class="ad-input" formControlName="name" placeholder="VD: Bắp rang bơ (L)">
    </div>
    <div class="ad-field">
      <label class="ad-label">Giá (đ)</label>
      <input class="ad-input" type="number" formControlName="price" placeholder="45000">
    </div>
    <div class="ad-field full-span">
      <label class="ad-label">Ảnh</label>
      <input class="ad-input" formControlName="imageUrl" placeholder="Dán URL hoặc tải ảnh lên">
      <div class="img-upload-row">
        <label class="ad-btn ad-btn--ghost">
          <mat-icon>upload</mat-icon> Tải Ảnh Lên
          <input type="file" accept="image/*" hidden (change)="onPickImage($event, 'imageUrl')">
        </label>
        <span class="img-upload-status" *ngIf="uploading">Đang tải...</span>
        <span class="img-upload-status err" *ngIf="uploadError">{{ uploadError }}</span>
      </div>
      <div class="img-preview" *ngIf="form.value.imageUrl">
        <img [src]="form.value.imageUrl" alt="">
      </div>
    </div>
    <div class="ad-field full-span">
      <label class="ad-label">Mô Tả</label>
      <input class="ad-input" formControlName="description" placeholder="Mô tả ngắn...">
    </div>
    <div class="ad-field full-span">
      <label class="ad-check"><input type="checkbox" formControlName="isAvailable"> Đang bán</label>
    </div>
    <div class="form-actions full-span">
      <button class="ad-btn ad-btn--primary" type="submit">Lưu</button>
      <button class="ad-btn ad-btn--ghost" type="button" (click)="cancelEdit()">Hủy</button>
    </div>
  </form>
</div>
</app-modal>
<app-confirm-modal [open]="confirmOpen" message="Bạn có chắc muốn xóa mục này?" (confirmed)="confirmDelete()" (closed)="confirmOpen = false"></app-confirm-modal>

<div class="ad-card ad-card--pad-0">
  <div class="ad-table-wrap">
    <table class="ad-table">
      <thead>
        <tr><th>Tên Món</th><th>Giá</th><th>Trạng Thái</th><th class="ad-td-actions">Thao Tác</th></tr>
      </thead>
      <tbody>
        <tr *ngFor="let x of items">
          <td><strong>{{ x.name }}</strong></td>
          <td>{{ x.price | number:'1.0-0' }}đ</td>
          <td>
            <span class="ad-pill" [class.ad-pill--success]="x.isAvailable" [class.ad-pill--neutral]="!x.isAvailable">
              {{ x.isAvailable ? 'Đang Bán' : 'Ngừng Bán' }}
            </span>
          </td>
          <td class="ad-td-actions">
            <button class="ad-icon-btn is-primary" (click)="edit(x)" title="Sửa"><mat-icon>edit</mat-icon></button>
            <button class="ad-icon-btn" (click)="delete(x.id)" title="Xóa"><mat-icon>delete</mat-icon></button>
          </td>
        </tr>
      </tbody>
    </table>
    <div *ngIf="!items.length" class="ad-empty"><mat-icon>fastfood</mat-icon><p>Rạp này chưa có món nào.</p></div>
  </div>
</div>
