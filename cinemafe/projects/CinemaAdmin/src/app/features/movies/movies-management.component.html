<div class="ad-page">
  <div class="ad-page-header">
    <div>
      <h1 class="ad-h1">Quản Lý Phim</h1>
      <p class="ad-sub">Thêm, chỉnh sửa và quản lý danh sách phim.</p>
    </div>
    <div class="ad-toolbar">
      <span class="ad-search">
        <mat-icon>search</mat-icon>
        <input class="ad-input" [(ngModel)]="search" placeholder="Tìm phim...">
      </span>
      <button class="ad-btn ad-btn--primary" (click)="openCreate()"><mat-icon>add</mat-icon> Thêm Phim</button>
    </div>
  </div>

  <!-- Table -->
  <div class="ad-card ad-card--pad-0">
    <div class="ad-table-wrap">
      <table class="ad-table">
        <thead>
          <tr><th>Tên Phim</th><th>Đạo Diễn</th><th>Thời Lượng</th><th>Ngôn Ngữ</th><th>Khởi Chiếu</th><th class="ad-td-actions">Thao Tác</th></tr>
        </thead>
        <tbody>
          <tr *ngFor="let m of filtered">
            <td>
              <div class="movie-cell">
                <span class="poster" [style.background-image]="m.posterUrl ? 'url(' + m.posterUrl + ')' : null">
                  <mat-icon *ngIf="!m.posterUrl">movie</mat-icon>
                </span>
                <strong>{{ m.title }}</strong>
              </div>
            </td>
            <td>{{ m.director || '—' }}</td>
            <td>{{ m.duration }} phút</td>
            <td>{{ m.language || '—' }}</td>
            <td>{{ m.releaseDate | date:'dd/MM/yyyy' }}</td>
            <td class="ad-td-actions">
              <button class="ad-icon-btn is-primary" (click)="editMovie(m)" title="Sửa"><mat-icon>edit</mat-icon></button>
              <button class="ad-icon-btn is-danger" (click)="deleteMovie(m.id)" title="Xóa"><mat-icon>delete</mat-icon></button>
            </td>
          </tr>
        </tbody>
      </table>
      <div *ngIf="!filtered.length" class="ad-empty"><mat-icon>movie</mat-icon><p>Chưa có phim nào.</p></div>
    </div>
  </div>
</div>

<!-- Create / edit form (separate component) + delete confirmation, shown as popups -->
<app-movie-form [open]="showForm" [movie]="editing" (saved)="onSaved()" (closed)="showForm = false"></app-movie-form>
<app-confirm-modal [open]="confirmOpen" message="Bạn có chắc muốn xóa phim này?" (confirmed)="confirmDelete()" (closed)="confirmOpen = false"></app-confirm-modal>
