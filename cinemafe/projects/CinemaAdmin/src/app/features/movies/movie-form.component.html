<app-modal [open]="open" [wide]="true" [title]="editingId ? ('movies.form.editTitle' | translate) : ('movies.form.newTitle' | translate)" (closed)="cancel()">
  <form [formGroup]="form" (ngSubmit)="save()" class="movie-form">
    <div class="ad-field">
      <label class="ad-label">{{ 'movies.form.title' | translate }}</label>
      <input class="ad-input" formControlName="title" [placeholder]="'movies.form.titlePlaceholder' | translate">
    </div>
    <div class="ad-field">
      <label class="ad-label">{{ 'movies.form.director' | translate }}</label>
      <input class="ad-input" formControlName="director" [placeholder]="'movies.form.directorPlaceholder' | translate">
    </div>
    <div class="ad-field">
      <label class="ad-label">{{ 'movies.form.cast' | translate }}</label>
      <input class="ad-input" formControlName="cast" [placeholder]="'movies.form.castPlaceholder' | translate">
    </div>
    <div class="ad-field">
      <label class="ad-label">{{ 'movies.form.duration' | translate }}</label>
      <input class="ad-input" type="number" formControlName="duration">
    </div>
    <div class="ad-field">
      <label class="ad-label">{{ 'movies.form.language' | translate }}</label>
      <input class="ad-input" formControlName="language" [placeholder]="'movies.form.languagePlaceholder' | translate">
    </div>
    <div class="ad-field">
      <label class="ad-label">{{ 'movies.form.subtitle' | translate }}</label>
      <input class="ad-input" formControlName="subtitle" [placeholder]="'movies.form.subtitlePlaceholder' | translate">
    </div>
    <div class="ad-field">
      <label class="ad-label">{{ 'movies.form.releaseDate' | translate }}</label>
      <input class="ad-input" type="date" formControlName="releaseDate">
    </div>
    <div class="ad-field">
      <label class="ad-label">{{ 'movies.form.endDate' | translate }}</label>
      <input class="ad-input" type="date" formControlName="endDate">
    </div>
    <div class="ad-field">
      <label class="ad-label">{{ 'movies.form.ageRestriction' | translate }}</label>
      <select class="ad-input" formControlName="ageRestrictionId">
        <option value="">{{ 'movies.form.selectOption' | translate }}</option>
        <option *ngFor="let a of ageRestrictions" [value]="a.id">{{ a.code }} — {{ a.description }}</option>
      </select>
    </div>
    <div class="ad-field">
      <label class="ad-label">{{ 'movies.form.trailer' | translate }}</label>
      <input class="ad-input" formControlName="trailerUrl" placeholder="https://...">
    </div>
    <div class="ad-field full-span">
      <label class="ad-label">{{ 'movies.form.genres' | translate }}</label>
      <select class="ad-input" multiple size="4" formControlName="movieTypeIds">
        <option *ngFor="let t of movieTypes" [value]="t.id">{{ t.name }}</option>
      </select>
      <span class="ad-hint">{{ 'movies.form.genresHint' | translate }}</span>
    </div>
    <div class="ad-field full-span">
      <label class="ad-label">{{ 'movies.form.poster' | translate }}</label>
      <input class="ad-input" formControlName="posterUrl" [placeholder]="'movies.form.posterPlaceholder' | translate">
      <div class="img-upload-row">
        <label class="ad-btn ad-btn--ghost">
          <mat-icon>upload</mat-icon> {{ 'movies.form.uploadImage' | translate }}
          <input type="file" accept="image/*" hidden (change)="onPickImage($event)">
        </label>
        <span class="img-upload-status" *ngIf="uploading">{{ 'movies.form.uploading' | translate }}</span>
        <span class="img-upload-status err" *ngIf="uploadError">{{ uploadError }}</span>
      </div>
      <div class="img-preview" *ngIf="form.value.posterUrl">
        <img [src]="form.value.posterUrl" alt="">
      </div>
    </div>
    <div class="ad-field full-span">
      <label class="ad-label">{{ 'movies.form.description' | translate }}</label>
      <textarea class="ad-input" rows="3" formControlName="description" [placeholder]="'movies.form.descriptionPlaceholder' | translate"></textarea>
    </div>
    <div class="form-actions full-span">
      <button class="ad-btn ad-btn--primary" type="submit">{{ 'common.save' | translate }}</button>
      <button class="ad-btn ad-btn--ghost" type="button" (click)="cancel()">{{ 'common.cancel' | translate }}</button>
    </div>
  </form>
</app-modal>
