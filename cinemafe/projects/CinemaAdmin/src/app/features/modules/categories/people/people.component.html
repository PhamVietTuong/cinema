<div class="ad-page">
  <div class="ad-page-header">
    <div>
      <h1 class="ad-h1">{{ 'people.title' | translate }}</h1>
      <p class="ad-sub">{{ 'people.subtitle' | translate }}</p>
    </div>
    <div class="ad-toolbar">
      <button mat-raised-button color="primary" (click)="openCreate()"><mat-icon>add</mat-icon> {{ 'common.add' | translate }}</button>
    </div>
  </div>

  <!-- Filters card — one filter UI feeds both the desktop grid and the mobile card list below. -->
  <mat-card class="ad-filter-card">
    <mat-card-content>
      <h3 class="ad-card-title">{{ 'common.filters' | translate }}</h3>
      <form [formGroup]="searchForm" class="ad-filter-grid">
        <mat-form-field appearance="outline">
          <mat-label>{{ 'people.name' | translate }}</mat-label>
          <input matInput formControlName="name" (input)="onFilterChange()">
        </mat-form-field>
      </form>
    </mat-card-content>
  </mat-card>

  <mat-card class="ad-card--pad-0">
    <!-- Desktop / tablet: ngx-datatable grid. -->
    <div class="ad-table-wrap ad-desktop-only">
      <ngx-datatable
        class="material ad-datatable"
        [rows]="pageRows"
        [columnMode]="'force'"
        [headerHeight]="44"
        [footerHeight]="50"
        [rowHeight]="'auto'"
        [externalPaging]="true"
        [externalSorting]="true"
        [count]="total"
        [offset]="pageOffset"
        [limit]="pageSize"
        [loadingIndicator]="loadingIndicator"
        [messages]="{ emptyMessage: 'people.empty' | translate, selectedMessage: '' }"
        (page)="onChangePage($event)">

        <ngx-datatable-column [name]="'people.photo' | translate" prop="photoUrl" [sortable]="false" [width]="80" [canAutoResize]="false">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <span class="person-avatar" [style.background-image]="row.photoUrl ? 'url(' + row.photoUrl + ')' : null">
              <mat-icon *ngIf="!row.photoUrl">person</mat-icon>
            </span>
          </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column [name]="'people.name' | translate" prop="name" [sortable]="false">
          <ng-template let-row="row" ngx-datatable-cell-template><strong>{{ row.name }}</strong></ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column [name]="'common.actions' | translate" [sortable]="false" [width]="150" [canAutoResize]="false">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <div class="ad-td-actions ad-td-actions--mat">
              <button mat-icon-button (click)="edit(row)" [matTooltip]="'common.edit' | translate"><mat-icon>edit</mat-icon></button>
              <button mat-icon-button (click)="delete(row.id)" [matTooltip]="'common.delete' | translate"><mat-icon>delete</mat-icon></button>
            </div>
          </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-footer>
          <ng-template ngx-datatable-footer-template>
            <div class="page-count">{{ 'common.totalEntries' | translate }} {{ total }}</div>
            <ngx-datatable-pager *ngIf="total > pageSize"></ngx-datatable-pager>
          </ng-template>
        </ngx-datatable-footer>
      </ngx-datatable>
    </div>

    <!-- Phones: a table doesn't fit legibly, so each row becomes its own Material card. -->
    <div class="ad-mobile-only">
      <mat-card class="ad-mobile-card" *ngFor="let row of pageRows" appearance="outlined">
        <mat-card-content>
          <div class="ad-mobile-card-title">
            <span class="person-avatar" [style.background-image]="row.photoUrl ? 'url(' + row.photoUrl + ')' : null">
              <mat-icon *ngIf="!row.photoUrl">person</mat-icon>
            </span>
            <strong>{{ row.name }}</strong>
          </div>
          <div class="ad-mobile-card-actions">
            <button mat-icon-button (click)="edit(row)" [matTooltip]="'common.edit' | translate"><mat-icon>edit</mat-icon></button>
            <button mat-icon-button (click)="delete(row.id)" [matTooltip]="'common.delete' | translate"><mat-icon>delete</mat-icon></button>
          </div>
        </mat-card-content>
      </mat-card>
      <div *ngIf="!pageRows.length" class="ad-empty"><mat-icon>person</mat-icon><p>{{ 'people.empty' | translate }}</p></div>

      <mat-paginator
        *ngIf="total > 0"
        [length]="total"
        [pageSize]="pageSize"
        [pageIndex]="pageOffset"
        [hidePageSize]="true"
        (page)="onChangePage({ pageSize: $event.pageSize, offset: $event.pageIndex })">
      </mat-paginator>
    </div>
  </mat-card>
</div>
