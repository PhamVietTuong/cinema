<div mat-dialog-title class="dialog-title">{{ (editingId ? 'news.editTitle' : 'news.newTitle') | translate }}</div>

<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content>
    <div class="dlg-grid">
      <div class="dlg-row">
        <div class="dlg-field">
          <label class="dlg-label" for="nw-title">{{ 'news.headline' | translate }}</label>
          <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <input matInput id="nw-title" formControlName="title" [placeholder]="'news.titlePlaceholder' | translate">
            <mat-error *ngIf="form.controls['title'].hasError('required')">{{ 'common.required' | translate }}</mat-error>
          </mat-form-field>
        </div>
      </div>

      <div class="dlg-row dlg-row--2">
        <div class="dlg-field">
          <label class="dlg-label" for="nw-author">{{ 'news.author' | translate }}</label>
          <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <input matInput id="nw-author" formControlName="author" [placeholder]="'news.authorPlaceholder' | translate">
          </mat-form-field>
        </div>
        <div class="dlg-field">
          <label class="dlg-label" for="nw-publishedAt">{{ 'news.publishedAt' | translate }}</label>
          <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <input matInput id="nw-publishedAt" type="date" formControlName="publishedAt">
          </mat-form-field>
        </div>
      </div>

      <div class="dlg-row">
        <div class="dlg-field">
          <label class="dlg-label" for="nw-thumbnailUrl">{{ 'news.thumbnail' | translate }}</label>
          <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <input matInput id="nw-thumbnailUrl" formControlName="thumbnailUrl" [placeholder]="'news.thumbnailPlaceholder' | translate">
          </mat-form-field>
          <div class="img-upload-row">
            <label class="ad-btn ad-btn--ghost">
              <mat-icon>upload</mat-icon> {{ 'news.uploadImage' | translate }}
              <input type="file" accept="image/*" hidden (change)="onPickImage($event, 'thumbnailUrl')">
            </label>
            <span class="img-upload-status" *ngIf="uploading">{{ 'common.loading' | translate }}</span>
            <span class="img-upload-status err" *ngIf="uploadError">{{ uploadError }}</span>
          </div>
          <div class="img-preview" *ngIf="form.value.thumbnailUrl">
            <img [src]="form.value.thumbnailUrl" alt="">
          </div>
        </div>
      </div>

      <div class="dlg-row">
        <div class="dlg-field">
          <label class="dlg-label" for="nw-content">{{ 'news.content' | translate }}</label>
          <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <textarea matInput id="nw-content" formControlName="content" rows="5" [placeholder]="'news.contentPlaceholder' | translate"></textarea>
            <mat-error *ngIf="form.controls['content'].hasError('required')">{{ 'common.required' | translate }}</mat-error>
          </mat-form-field>
        </div>
      </div>

      <div class="dlg-switch">
        <span class="dlg-switch-label" id="nw-isPublished-lbl">{{ 'news.published' | translate }}</span>
        <mat-slide-toggle formControlName="isPublished" aria-labelledby="nw-isPublished-lbl"></mat-slide-toggle>
      </div>
    </div>
  </mat-dialog-content>

  <div mat-dialog-actions class="dialog-actions">
    <button mat-raised-button type="button" (click)="cancel()">{{ 'common.cancel' | translate }}</button>
    <button mat-raised-button color="primary" type="submit">{{ 'common.save' | translate }}</button>
  </div>
</form>

<button mat-icon-button type="button" class="dialog-close-btn" [attr.aria-label]="'common.close' | translate" (click)="cancel()">
  <mat-icon>close</mat-icon>
</button>
