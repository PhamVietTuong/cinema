<div mat-dialog-title class="dialog-title">{{ (editingId ? 'people.editTitle' : 'people.newTitle') | translate }}</div>

<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content>
    <div class="dlg-grid">
      <div class="dlg-row">
        <div class="dlg-field">
          <label class="dlg-label" for="pr-name">{{ 'people.name' | translate }}</label>
          <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <input matInput id="pr-name" formControlName="name" [placeholder]="'people.namePlaceholder' | translate">
            <mat-error *ngIf="form.controls['name'].hasError('required')">{{ 'common.required' | translate }}</mat-error>
          </mat-form-field>
        </div>
      </div>

      <div class="dlg-row">
        <div class="dlg-field">
          <label class="dlg-label" for="pr-photoUrl">{{ 'people.photo' | translate }}</label>
          <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <input matInput id="pr-photoUrl" formControlName="photoUrl" [placeholder]="'people.photoPlaceholder' | translate">
          </mat-form-field>
          <div class="img-upload-row">
            <label class="ad-btn ad-btn--ghost">
              <mat-icon>upload</mat-icon> {{ 'people.uploadImage' | translate }}
              <input type="file" accept="image/*" hidden (change)="onPickImage($event, 'photoUrl')">
            </label>
            <span class="img-upload-status" *ngIf="uploading">{{ 'common.loading' | translate }}</span>
            <span class="img-upload-status err" *ngIf="uploadError">{{ uploadError }}</span>
          </div>
          <div class="img-preview" *ngIf="form.value.photoUrl">
            <img [src]="form.value.photoUrl" alt="">
          </div>
        </div>
      </div>
    </div>
  </mat-dialog-content>

  <div mat-dialog-actions class="dialog-actions">
    <button mat-raised-button type="button" (click)="cancel()">{{ 'common.cancel' | translate }}</button>
    <button mat-raised-button color="primary" type="submit">{{ 'common.save' | translate }}</button>
  </div>
</form>

<button mat-icon-button type="button" class="dialog-close-btn" (click)="cancel()">
  <mat-icon>close</mat-icon>
</button>
