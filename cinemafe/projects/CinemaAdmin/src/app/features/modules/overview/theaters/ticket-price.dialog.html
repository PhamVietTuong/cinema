<div mat-dialog-title class="dialog-title">{{ 'theaters.ticketPrices.editCellTitle' | translate }}</div>

<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content>
    <div class="dlg-grid">
      <p class="ad-sub tp-dialog-sub">
        {{ data.roomTypeName }} · {{ data.timeSlot.name }} ({{ data.timeSlot.startTime }}–{{ data.timeSlot.endTime }})
      </p>

      <div class="dlg-row">
        <div class="dlg-field">
          <label class="dlg-label">{{ 'theaters.ticketPrices.daysLabel' | translate }}</label>
          <div class="tp-day-chips">
            <button
              type="button" class="tp-day-chip"
              *ngFor="let d of dayOptions"
              [class.tp-day-chip--selected]="isDaySelected(d.value)"
              (click)="toggleDay(d.value)">
              {{ d.shortName | translate }}
            </button>
          </div>
          <mat-error *ngIf="form.controls['daysOfWeek'].touched && !form.value.daysOfWeek?.length">
            {{ 'common.required' | translate }}
          </mat-error>
        </div>
      </div>

      <div class="dlg-row">
        <div class="dlg-field">
          <label class="dlg-label">{{ 'theaters.ticketPrices.multiplierLabel' | translate }}</label>
          <div class="tp-stepper">
            <button type="button" mat-icon-button (click)="adjustMultiplier(-0.05)"><mat-icon>remove</mat-icon></button>
            <mat-form-field appearance="outline" subscriptSizing="dynamic" class="tp-stepper-field">
              <input matInput type="number" step="0.05" min="0.05" formControlName="priceMultiplier">
            </mat-form-field>
            <button type="button" mat-icon-button (click)="adjustMultiplier(0.05)"><mat-icon>add</mat-icon></button>
          </div>
          <mat-hint class="tp-hint">{{ 'theaters.ticketPrices.multiplierHint' | translate }}</mat-hint>
        </div>
      </div>
    </div>
  </mat-dialog-content>

  <div mat-dialog-actions class="dialog-actions">
    <button
      mat-button type="button" color="warn" *ngIf="data.existing"
      (click)="resetDefault()">{{ 'theaters.ticketPrices.resetDefault' | translate }}</button>
    <span class="tp-actions-spacer"></span>
    <button mat-raised-button type="button" (click)="cancel()">{{ 'common.cancel' | translate }}</button>
    <button mat-raised-button color="primary" type="submit">{{ 'common.save' | translate }}</button>
  </div>
</form>

<button mat-icon-button type="button" class="dialog-close-btn" (click)="cancel()">
  <mat-icon>close</mat-icon>
</button>
