<div class="tab-toolbar">
  <p class="ad-sub">{{ 'theaters.seatTypes.subtitle' | translate }}</p>
</div>

<mat-card class="ad-card--pad-0">
  <!-- Desktop / tablet: ngx-datatable grid. -->
  <div class="ad-table-wrap ad-desktop-only">
    <ngx-datatable
      class="material ad-datatable"
      [rows]="pageRows"
      [columnMode]="'force'"
      [headerHeight]="44"
      [footerHeight]="50"
      [rowHeight]="'auto'"
      [externalPaging]="true"
      [externalSorting]="true"
      [count]="total"
      [offset]="pageOffset"
      [limit]="pageSize"
      [loadingIndicator]="loadingIndicator"
      [messages]="{ emptyMessage: 'theaters.seatTypes.empty' | translate, selectedMessage: '' }"
      (page)="onChangePage($event)">

      <ngx-datatable-column [name]="'theaters.seatTypes.color' | translate" prop="color" [sortable]="false" [width]="80" [canAutoResize]="false">
        <ng-template let-row="row" ngx-datatable-cell-template><span class="color-dot" [style.background]="row.color"></span></ng-template>
      </ngx-datatable-column>

      <ngx-datatable-column [name]="'theaters.seatTypes.nameLabel' | translate" prop="name" [sortable]="false">
        <ng-template let-row="row" ngx-datatable-cell-template><strong>{{ row.name }}</strong></ng-template>
      </ngx-datatable-column>

      <ngx-datatable-column [name]="'common.description' | translate" prop="description" [sortable]="false">
        <ng-template let-row="row" ngx-datatable-cell-template>{{ row.description || '—' }}</ng-template>
      </ngx-datatable-column>

      <ngx-datatable-column [name]="'common.actions' | translate" [sortable]="false" [width]="90" [canAutoResize]="false">
        <ng-template let-row="row" ngx-datatable-cell-template>
          <div class="ad-td-actions ad-td-actions--mat">
            <button mat-icon-button (click)="edit(row)" [matTooltip]="'common.edit' | translate"><mat-icon>edit</mat-icon></button>
          </div>
        </ng-template>
      </ngx-datatable-column>

      <ngx-datatable-footer>
        <ng-template ngx-datatable-footer-template>
          <div class="page-count">{{ 'common.totalEntries' | translate }} {{ total }}</div>
          <ngx-datatable-pager *ngIf="total > pageSize"></ngx-datatable-pager>
        </ng-template>
      </ngx-datatable-footer>
    </ngx-datatable>
  </div>

  <!-- Phones: a table doesn't fit legibly, so each row becomes its own Material card. -->
  <div class="ad-mobile-only">
    <mat-card class="ad-mobile-card" *ngFor="let row of pageRows" appearance="outlined">
      <mat-card-content>
        <div class="ad-mobile-card-title"><span class="color-dot" [style.background]="row.color"></span> <strong>{{ row.name }}</strong></div>
        <div class="ad-mobile-card-row"><span>{{ 'common.description' | translate }}</span><span>{{ row.description || '—' }}</span></div>
        <div class="ad-mobile-card-actions">
          <button mat-icon-button (click)="edit(row)" [matTooltip]="'common.edit' | translate"><mat-icon>edit</mat-icon></button>
        </div>
      </mat-card-content>
    </mat-card>
    <div *ngIf="!pageRows.length" class="ad-empty"><mat-icon>event_seat</mat-icon><p>{{ 'theaters.seatTypes.empty' | translate }}</p></div>

    <mat-paginator
      *ngIf="total > 0"
      [length]="total"
      [pageSize]="pageSize"
      [pageIndex]="pageOffset"
      [hidePageSize]="true"
      (page)="onChangePage({ pageSize: $event.pageSize, offset: $event.pageIndex })">
    </mat-paginator>
  </div>
</mat-card>
