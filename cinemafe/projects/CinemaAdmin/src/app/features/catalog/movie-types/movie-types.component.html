<div class="ad-page">
  <div class="ad-page-header">
    <div>
      <h1 class="ad-h1">Quản Lý Thể Loại Phim</h1>
      <p class="ad-sub">Danh mục thể loại dùng để phân loại phim.</p>
    </div>
    <div class="ad-toolbar">
      <button class="ad-btn ad-btn--primary" (click)="openCreate()"><mat-icon>add</mat-icon> Thêm</button>
    </div>
  </div>

  <app-modal [open]="showForm" (closed)="cancelEdit()">
  <div class="ad-card form-card">
    <h3 class="ad-card-title">{{ editingId ? 'Chỉnh Sửa Thể Loại' : 'Thể Loại Mới' }}</h3>
    <form [formGroup]="form" (ngSubmit)="save()" class="catalog-form">
      <div class="ad-field full-span">
        <label class="ad-label">Tên Thể Loại</label>
        <input class="ad-input" formControlName="name" placeholder="VD: Hành động">
      </div>
      <div class="form-actions full-span">
        <button class="ad-btn ad-btn--primary" type="submit">Lưu</button>
        <button class="ad-btn ad-btn--ghost" type="button" (click)="cancelEdit()">Hủy</button>
      </div>
    </form>
  </div>
  </app-modal>
  <app-confirm-modal [open]="confirmOpen" message="Bạn có chắc muốn xóa mục này?" (confirmed)="confirmDelete()" (closed)="confirmOpen = false"></app-confirm-modal>

  <div class="ad-card ad-card--pad-0">
    <div class="ad-table-wrap">
      <table class="ad-table">
        <thead>
          <tr><th>Tên Thể Loại</th><th class="ad-td-actions">Thao Tác</th></tr>
          <tr class="ad-filter-row">
            <th><input class="ad-filter-input" [(ngModel)]="filters['name']" (input)="onFilterChange()" placeholder="Lọc..."></th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let x of items">
            <td><strong>{{ x.name }}</strong></td>
            <td class="ad-td-actions">
              <button class="ad-icon-btn is-primary" (click)="edit(x)" title="Sửa"><mat-icon>edit</mat-icon></button>
              <button class="ad-icon-btn" (click)="delete(x.id)" title="Xóa"><mat-icon>delete</mat-icon></button>
            </td>
          </tr>
        </tbody>
      </table>
      <div *ngIf="!items.length" class="ad-empty"><mat-icon>category</mat-icon><p>Không có thể loại nào.</p></div>
    </div>

    <div class="ad-pagination" *ngIf="totalCount > 0">
      <span class="ad-pagination-info">{{ rangeStart }}–{{ rangeEnd }} / {{ totalCount }}</span>
      <span class="ad-pagination-size">
        <label class="ad-label">Hiển thị</label>
        <select class="ad-input" [ngModel]="pageSize" (ngModelChange)="changePageSize($event)">
          <option *ngFor="let s of pageSizeOptions" [value]="s">{{ s }}</option>
        </select>
      </span>
      <span class="ad-pagination-nav">
        <button class="ad-icon-btn" type="button" (click)="prevPage()" [disabled]="pageIndex <= 1" title="Trước"><mat-icon>chevron_left</mat-icon></button>
        <span class="ad-pagination-page">Trang {{ pageIndex }}/{{ totalPages }}</span>
        <button class="ad-icon-btn" type="button" (click)="nextPage()" [disabled]="pageIndex >= totalPages" title="Sau"><mat-icon>chevron_right</mat-icon></button>
      </span>
    </div>
  </div>
</div>
