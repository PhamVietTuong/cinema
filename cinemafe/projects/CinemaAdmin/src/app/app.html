@if (isBackOffice$ | async) {
  <cl-app-shell
    [brand]="brand"
    [menu]="menu"
    [user]="user$ | async"
    [userFallback]="userFallback"
    defaultTitleKey="pageTitle.default"
    (logout)="doLogout()">
    <router-outlet></router-outlet>
  </cl-app-shell>
} @else {
  <router-outlet></router-outlet>
}
