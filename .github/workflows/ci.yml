name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cinemabe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore Cinema.sln
      # Analyzers (cinemabe/Directory.Build.props) are a ratchet: the warning count may not grow more than 5% over the baseline.
      - name: Build
        shell: bash # pipefail, so a failed build still fails the step despite `| tee`
        run: dotnet build Cinema.sln --no-restore -c Release | tee "$RUNNER_TEMP/build.log"
      - name: Analyzer warning ratchet
        working-directory: .
        run: python3 .github/scripts/check-warnings.py "$RUNNER_TEMP/build.log" .github/scripts/analyzer-baseline.txt 5
      # NuGet advisories, direct and transitive. Fails when any vulnerable package is reported. Informational
      # (continue-on-error) while the 2026-11 backlog is open (Http.Connections 1.2.0 High, WebUtilities 2.3.0 Moderate,
      # both transitive); remove continue-on-error once it is clean.
      - name: NuGet vulnerability audit
        continue-on-error: true
        shell: bash # pipefail: a failing `dotnet list` fails the step
        run: |
          dotnet list Cinema.sln package --vulnerable --include-transitive 2>&1 | tee "$RUNNER_TEMP/vuln.log"
          if grep -q "has the following vulnerable packages" "$RUNNER_TEMP/vuln.log"; then exit 1; fi
          if ! grep -q "has no vulnerable packages" "$RUNNER_TEMP/vuln.log"; then
            echo "::warning::dotnet list printed neither a vulnerable nor a clean verdict - output format changed?"
            exit 1
          fi
      # xUnit tests use Moq — no database required.
      - run: dotnet test Cinema/2-Business/Cinema.Business.Tests --no-build -c Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory TestResults
      # Controller architecture, authorization and IPN-contract tests live in their own project.
      - run: dotnet test Cinema/1-Service/Cinema.Service.WebApiHost.Tests --no-build -c Release --verbosity normal
      # Coverage ratchet for the business layer (the core). Raise the number as coverage grows; never lower it.
      - name: Enforce business-layer coverage
        working-directory: .
        run: python3 .github/scripts/check-coverage.py 60 Cinema.Business $(find cinemabe/TestResults -name coverage.cobertura.xml)
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: cinemabe/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # Informational until a clean run is seen on master; then remove continue-on-error to make it blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: a secret removed later is still a leaked secret
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --source /repo --config /repo/.gitleaks.toml --no-banner --redact

  docker:
    name: Docker image (build only, no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cinema-api:ci ./cinemabe

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cinemafe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: cinemafe/package-lock.json
      # --legacy-peer-deps: the workspace has a known Angular peer-version skew.
      - run: npm ci --legacy-peer-deps
      # Fails on errors only. The config keeps the large pre-existing backlog
      # (prefer-control-flow, a11y labels, prefer-inject) at warning level — see eslint.config.js.
      # lint:ci is `eslint --max-warnings <baseline>`: errors fail, and so does any growth of the warning backlog.
      - run: npm run lint:ci
      # Informational while the backlog is open (67 advisories at 2026-11, mostly Angular/tooling transitives);
      # remove continue-on-error once `npm audit --audit-level=high` is clean.
      - name: npm audit (high and above)
        continue-on-error: true
        run: npm audit --audit-level=high
      # CinemaLib must be built before the apps: the `CinemaLib` path maps to dist/.
      - run: npx ng build CinemaLib
      - run: npx ng test CinemaLib   --watch=false --coverage --coverage-reporters lcovonly --coverage-reporters text-summary
      - run: npx ng test CinemaUser  --watch=false
      - run: npx ng test CinemaAdmin --watch=false
      - run: npx ng test CinemaStaff --watch=false
      - run: npx ng build CinemaUser --configuration production
      - run: npx ng build CinemaAdmin --configuration production
      - run: npx ng build CinemaStaff --configuration production
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: cinemafe/coverage/**
          if-no-files-found: warn

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Needs a real database, the API and both apps running, so it is slower than the other jobs.
    timeout-minutes: 30
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Cinema_CI_Pwd_123!'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Cinema_CI_Pwd_123!' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      SA_PASSWORD: 'Cinema_CI_Pwd_123!'
      CINEMA_DB: 'Server=localhost,1433;Database=Cinema;User ID=sa;Password=Cinema_CI_Pwd_123!;TrustServerCertificate=True;MultipleActiveResultSets=true'
      JWT__Secret: 'ci-only-signing-key-not-used-anywhere-else-0123456789'
      CINEMA_USER_URL: 'http://localhost:4202'
      CINEMA_ADMIN_URL: 'http://localhost:4201'
      CINEMA_STAFF_URL: 'http://localhost:4203'
      # A throw-away VNPay merchant for the callback contract specs: the API signs/verifies with this secret and the
      # specs sign their IPNs with the same value. Not a real credential.
      VNPAY_TMN_CODE: 'CIE2ETMN'
      VNPAY_HASH_SECRET: 'ci-only-vnpay-hash-secret-0123456789'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: cinemafe/package-lock.json

      - name: Install sqlcmd
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/24.04/prod noble main" \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      - name: Create and populate the database
        working-directory: cinemabe
        run: |
          sqlcmd -C -S localhost,1433 -U sa -P "$SA_PASSWORD" -Q "CREATE DATABASE [Cinema];"
          # -I: QUOTED_IDENTIFIER ON (the filtered indexes need it); -b: fail on any SQL error;
          # -f 65001: the scripts hold Vietnamese N'...' literals.
          # create_db.sql is a baseline — the idempotent upgrade_db.sql brings it to the current schema.
          for script in create_db upgrade_db insert_db; do
            sqlcmd -C -I -b -S localhost,1433 -U sa -P "$SA_PASSWORD" -d Cinema -f 65001 -i "sql/$script.sql"
          done

      - name: Move past showtimes to tomorrow
        # insert_db.sql builds its showtime grid relative to the day it was written; the booking spec needs an
        # upcoming one and fails (never skips) without it.
        run: sqlcmd -C -I -b -S localhost,1433 -U sa -P "$SA_PASSWORD" -d Cinema -f 65001 -i e2e/sql/seed-future-showtime.sql

      - name: Seed the admin + customer accounts
        working-directory: cinemabe
        env:
          ConnectionStrings__CinemaDatabase: ${{ env.CINEMA_DB }}
        # The test project is dual-purpose: `dotnet run` seeds admin@cinema.vn / user@cinema.vn.
        run: dotnet run --project Cinema/2-Business/Cinema.Business.Tests

      - name: Start the Web API
        working-directory: cinemabe
        env:
          ConnectionStrings__CinemaDatabase: ${{ env.CINEMA_DB }}
          ASPNETCORE_URLS: 'http://localhost:5102'
          # The e2e flow pays through the Sandbox gateway, which is off outside Development by default.
          Payments__EnableSandbox: 'true'
          # The suite signs in about 16 times from one IP within a few minutes; the default Auth limit (10/min) rejects
          # the later logins whenever a run is fast, which made `admin lands on /home` fail at random.
          RateLimiting__AuthPermitLimit: '1000'
          Payments__VnPay__TmnCode: ${{ env.VNPAY_TMN_CODE }}
          Payments__VnPay__HashSecret: ${{ env.VNPAY_HASH_SECRET }}
          AllowedOrigins__0: 'http://localhost:4202'
          AllowedOrigins__1: 'http://localhost:4201'
          AllowedOrigins__2: 'http://localhost:4203'
        run: |
          dotnet run --project Cinema/1-Service/Cinema.Service.WebApiHost -c Release > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5102/health > /dev/null; then echo "API up"; exit 0; fi
            sleep 5
          done
          echo "API failed to start:"; cat "$RUNNER_TEMP/api.log"; exit 1

      - name: Build and serve the three apps
        working-directory: cinemafe
        run: |
          npm ci --legacy-peer-deps
          npx ng build CinemaLib
          npx ng serve CinemaUser  --port 4202 --configuration development > "$RUNNER_TEMP/user.log" 2>&1 &
          npx ng serve CinemaAdmin --port 4201 --configuration development > "$RUNNER_TEMP/admin.log" 2>&1 &
          npx ng serve CinemaStaff --port 4203 --configuration development > "$RUNNER_TEMP/staff.log" 2>&1 &
          for port in 4202 4201 4203; do
            for i in $(seq 1 60); do
              if curl -fsS "http://localhost:$port" > /dev/null; then echo "port $port up"; break; fi
              if [ "$i" = "60" ]; then
                echo "port $port failed to serve:"; cat "$RUNNER_TEMP"/*.log; exit 1
              fi
              sleep 5
            done
          done

      - name: Run Playwright
        working-directory: e2e
        env:
          E2E_VNPAY_HASH_SECRET: ${{ env.VNPAY_HASH_SECRET }}
        run: |
          npm ci
          npx playwright install --with-deps chromium
          # `github` turns every failed test into an annotation on the check run, readable without downloading the report.
          npx playwright test --reporter=list,html,github

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/**
            e2e/test-results/**
          if-no-files-found: warn

      - name: Dump server logs on failure
        if: failure()
        run: |
          echo '── api ──';   cat "$RUNNER_TEMP/api.log"   || true
          echo '── user ──';  cat "$RUNNER_TEMP/user.log"  || true
          echo '── admin ──'; cat "$RUNNER_TEMP/admin.log" || true
          echo '── staff ──'; cat "$RUNNER_TEMP/staff.log" || true
